<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>明星学校</title>
  <link rel="icon" type="image/png" href="/assets/home/broadcast.png">
<!-- 挂载到明星学校 /broadcast：所有相对资源基于此路径解析 -->
<base href="/broadcast/">
<!-- 全站唯一样式表（原 12 个 CSS 合并，绝对路径避开 <base href> 重写） -->
<link rel="stylesheet" href="/assets/all.css?v=0.48">
<!-- 全站国际化框架：语言包加载完成后再初始化页面（绝对路径避开 <base href> 重写） -->
<script src="/assets/i18n.js?v=0.1"></script>
<script>
  // 防首屏闪白：在 CSS 加载前就读 localStorage，立即给 <body> 加 dark-mode。
  (function(){
    var saved = null;
    try { saved = localStorage.getItem('darkMode'); } catch(e){}
    var isDark = saved !== null ? saved === 'true'
                : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (isDark) document.write('<body class="bc-app dark-mode">');
    else document.write('<body class="bc-app">');
  })();
</script>
</head>
<body>

<div class="toast-container" id="toast-container"></div>

<div class="main-container">

  <!-- 侧边栏（统一网盘规格：72px 白底；激活项由路由器高亮） -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <!-- 平台 Logo（仅展示，不可点击跳转） -->
      <span class="sidebar-logo" title="明星广播器" data-i18n-title="broadcast.title">
        <img src="/assets/home/broadcast.png" alt="明星广播器">
      </span>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav">
      <!-- 导航：首页/广播（控制台）+ 四个频道收听子页面；激活态由路由器按 data-channel 高亮 -->
      <a class="nav-item" href="./" title="首页/广播" data-i18n-title="broadcast.nav.home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      </a>
      <a class="nav-item" href="./channel/操场" data-channel="操场" title="操场频道" data-i18n-title="broadcast.nav.playground">
        <img class="ch-icon" src="操场.svg" alt="操场">
      </a>
      <a class="nav-item" href="./channel/教室" data-channel="教室" title="教室频道" data-i18n-title="broadcast.nav.classroom">
        <img class="ch-icon" src="教室.svg" alt="教室">
      </a>
      <a class="nav-item" href="./channel/食堂" data-channel="食堂" title="食堂频道" data-i18n-title="broadcast.nav.canteen">
        <img class="ch-icon" src="食堂.svg" alt="食堂">
      </a>
      <a class="nav-item" href="./channel/魔法教室" data-channel="魔法教室" title="魔法教室频道" data-i18n-title="broadcast.nav.magic">
        <img class="ch-icon" src="魔法教室.svg" alt="魔法教室">
      </a>
    </nav>
  </aside>

  <!-- 主内容区：顶栏 + 双视图（SPA 由 app.js 切换 hidden） -->
  <div class="main-content">

    <header class="topbar">
      <!-- 用户区（统一网盘顶栏）：仅头像（名字悬浮 title 查看），由 js/common.js 的 initTopbarUser 拉取 /api/me 填充 -->
      <div class="topbar-right">
        <div class="user-info">
          <div class="user-avatar">
            <!-- 默认头像兜底；/api/me 返回已上传头像后由 JS 替换。容器禁止带背景色；悬浮 title 显示名字 -->
            <img id="user-avatar-img" src="/assets/home/default-avatar.png" alt="用户头像">
          </div>
          <!-- 用户名：桌面端隐藏（悬浮头像 title 查看），小屏显示 -->
          <span class="user-name" id="user-name"></span>
        </div>
      </div>
    </header>

    <main class="content-area">

      <!-- 视图一：控制台 -->
      <section id="view-console">
        <div class="section-title">
          <h2 data-i18n="broadcast.console.channelsTitle">频道状态</h2>
        </div>
        <div class="channel-grid" id="channel-grid"></div>

        <div class="section-title" style="margin-top:28px;">
          <h2><span data-i18n="broadcast.console.audioList">音频列表</span> <span id="audio-count"></span></h2>
          <button class="btn btn-column5" id="btn-rescan" title="重新扫描 audio 目录" data-i18n-title="broadcast.console.rescanTitle" data-i18n="broadcast.console.rescan">
            重新扫描
          </button>
        </div>
        <div id="audio-list-wrap"></div>
      </section>

      <!-- 视图二：频道收听页 -->
      <section id="view-channel" hidden>
        <div class="channel-main">
          <div class="large-card">
            <div class="channel-icon" id="card-icon"></div>
            <h1 class="channel-name" id="card-name">—</h1>
            <span class="badge idle status-badge" id="card-badge" data-i18n="broadcast.status.idle">空闲</span>
            <div class="now-playing" id="card-now" data-i18n="broadcast.channel.waiting">等待投放…</div>
            <div class="now-hint" id="card-hint" data-i18n="broadcast.channel.hintIdle">收听该频道，接收控制台投放的音频</div>
            <div class="player-ui" id="player-ui">
              <span class="icon" id="player-icon"></span>
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

</div>

<!-- 投放弹窗（放在双视图之外，避免被视图 hidden 连带隐藏） -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3 class="modal-title" data-i18n="broadcast.console.modalTitle">投放音频</h3>
    <div class="modal-body" id="modal-audio-info"></div>
    <div class="channel-pick-list" id="channel-pick-list"></div>
    <div class="modal-buttons">
      <button class="btn btn-column5" id="modal-cancel" data-i18n="broadcast.console.cancel">取消</button>
      <button class="btn btn-column2" id="modal-confirm" data-i18n="broadcast.console.play">投放</button>
    </div>
  </div>
</div>

<!-- 真实播放元素：全局唯一，永久隐藏，不占位；切视图不解锁失效 -->
<audio id="audio" preload="auto" playsinline></audio>

<!-- 首次解锁遮罩：用户点一下 → 给 audio 元素绑定播放许可（先静音预热再恢复）
     初始带 hidden：SPA 里控制台视图也会加载本壳，由 ChannelView.init 决定何时显示 -->
<div class="unlock-overlay hidden" id="unlock-overlay">
  <div class="unlock-card">
    <span class="icon" id="unlock-icon"></span>
    <h2 data-i18n="broadcast.channel.unlockTitle">点击开始收听</h2>
    <p data-i18n="broadcast.channel.unlockDesc">浏览器策略要求首次点击后才能播放声音。点击一下，后续就会自动同步了。</p>
  </div>
</div>

<!-- 被拦截后常驻浮层：显示「点击继续播放」 -->
<div class="blocked-float hidden" id="blocked-float">
  <p data-i18n="broadcast.channel.blockedText">浏览器阻止了自动播放，点击继续播放</p>
  <button class="btn btn-column2" id="blocked-btn" data-i18n="broadcast.channel.continuePlay">
    继续播放
  </button>
</div>

<script src="js/icons.js?v=0.32"></script>
<script src="js/common.js?v=0.32"></script>
<script defer src="js/index.js?v=0.32"></script>
<script defer src="js/channel.js?v=0.32"></script>
<script defer src="js/app.js?v=0.32"></script>

<!-- 悬浮工具条已抽至平台公共骨架 /assets/common-ui.js（全站共用，一处维护） -->
<script src="/assets/common-ui.js"></script>
</body>
</html>
