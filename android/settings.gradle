// 工程级设置：声明仓库地址与参与构建的模块
pluginManagement {
    repositories {
        google()            // Android 官方插件与依赖
        mavenCentral()      // 通用 Java/Android 依赖
        gradlePluginPortal()// Gradle 插件门户
    }
}

dependencyResolutionManagement {
    // 禁止在模块内单独声明仓库，统一在此管理，避免版本来源混乱
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

// 根工程名称（Android Studio 中显示的项目名）
rootProject.name = "MingxingSchool"

// 只包含 app 模块：登录页与后续页面都在这里
include ':app'
