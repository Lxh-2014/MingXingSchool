<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>邻语</title>
<style>
  /* 基础重置：整页不出现浏览器滚动条，交互交给内部区域 */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #ffffff; color: #1c1c1e;
    -webkit-text-size-adjust: 100%;      /* 禁用系统字体缩放导致的布局错位 */
    overscroll-behavior: none;           /* 关闭下拉回弹，避免整页跟着拖动 */
  }
  #app { height: 100%; display: flex; flex-direction: column; }

  /* 顶栏：返回 / 居中标题 / 菜单 */
  #header {
    flex: 0 0 auto; height: 52px; display: flex; align-items: center;
    padding: 0 4px; background: #ffffff; border-bottom: 1px solid #ededed;
  }
  #header .icon-btn {
    width: 40px; height: 40px; border: none; background: transparent;
    font-size: 24px; line-height: 1; color: #1c1c1e; padding: 0;
  }
  #header .title {
    flex: 1; text-align: center; font-size: 17px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #main { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  /* 宽屏左栏（网页版双栏布局）：默认隐藏，≥768px 由媒体查询显示 */
  #side { display: none; }

  /* 会话列表 */
  .search-bar { flex: 0 0 auto; padding: 8px 12px; background: #fff; }
  .search-bar input {
    width: 100%; height: 36px; border: none; outline: none; border-radius: 18px;
    background: #f2f3f5; padding: 0 14px; font-size: 14px; color: #1c1c1e;
  }
  .list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #fff; }
  .conv { display: flex; align-items: center; padding: 12px 16px; }
  .conv:active { background: #f7f7f8; }
  .avatar-box { position: relative; flex: 0 0 auto; width: 48px; height: 48px; }
  .avatar {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
    background: transparent; display: block;
  }
  .avatar-text {
    width: 100%; height: 100%; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; color: #a8adb6;
    font-size: 18px; font-weight: 500; position: relative; overflow: hidden;
    background: transparent;
  }
  /* 头像图片：绝对定位铺满圆形占位层，加载成功后由 JS 显示 */
  .avatar-text > img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border-radius: 50%; object-fit: cover; display: none;
  }
  .badge {
    position: absolute; top: -3px; right: -4px; min-width: 18px; height: 18px;
    padding: 0 5px; border-radius: 9px; background: #ff3b30; color: #fff;
    font-size: 10px; line-height: 18px; text-align: center;
  }
  .conv-mid { flex: 1; min-width: 0; margin-left: 12px; }
  .conv-name {
    font-size: 16px; color: #1c1c1e; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .conv-preview {
    margin-top: 4px; font-size: 14px; color: #8a8f99;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .conv-time { flex: 0 0 auto; margin-left: 8px; font-size: 12px; color: #b0b3b8; align-self: flex-start; padding-top: 2px; }

  /* 聊天页 */
  .msgs { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #f2f3f5; padding: 12px; }
  .time-tip { text-align: center; font-size: 12px; color: #9aa0a6; margin: 10px 0; }
  .msg {
    display: flex; margin-bottom: 12px; align-items: flex-start;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  }
  .msg.mine { flex-direction: row-reverse; }
  .msg .avatar-box { width: 40px; height: 40px; }
  .msg-col { max-width: 72%; margin: 0 8px; display: flex; flex-direction: column; }
  .msg.mine .msg-col { align-items: flex-end; }
  .nick {
    display: flex; align-items: center; gap: 6px; margin: 0 0 4px; padding: 0 4px;
    font-size: 12px; color: #8a8f99;
  }
  /* 身份标：与网页版一致，仅班主任 / 老师 / 家委展示，底色与文字色分别对应 */
  .role {
    flex: 0 0 auto; padding: 2px 6px; border-radius: 4px;
    font-size: 10px; font-weight: 600; line-height: 1.3;
  }
  .role-head { background: #f7dfcd; color: #ff8d40; }        /* 班主任 */
  .role-teacher { background: #c4e3f7; color: #0099ff; }     /* 老师 */
  .role-committee { background: #e5f3e7; color: #008c1c; }   /* 家委 */
  .bubble {
    background: #ffffff; border-radius: 10px; padding: 9px 12px;
    font-size: 15px; line-height: 1.45; color: #1c1c1e; word-break: break-word;
  }
  .msg.mine .bubble { background: #12b7f5; color: #ffffff; }
  /* 纯媒体消息（图片 / 文件 / 单个表情）不套气泡框，与网页版一致 */
  .bubble.media, .msg.mine .bubble.media, .bubble.super, .msg.mine .bubble.super {
    background: transparent; padding: 0;
  }
  .bubble img { display: block; max-width: 200px; max-height: 240px; border-radius: 8px; }
  /* 去掉气泡后图片可以更大，观感接近 QQ */
  .bubble.media img { max-width: 62vw; max-height: 320px; }
  /* 表情：普通消息里 28px 与文字同行，单个表情放大到 110px */
  .bubble .emoji { display: inline-block; width: 28px; height: 28px; vertical-align: -7px; margin: 0 1px; }
  .bubble.super .emoji { width: 110px; height: 110px; margin: 0; }
  .quote { font-size: 11px; color: #8a8f99; margin-bottom: 4px; }
  .msg.mine .quote { color: #dff2ff; }
  .sys-tip { text-align: center; font-size: 12px; color: #9aa0a6; margin: 10px 0; }

  /* 文件卡片 */
  .file-card {
    display: flex; align-items: center; gap: 12px; width: 232px; max-width: 100%;
    background: #fff; border-radius: 8px; padding: 10px 12px;
  }
  .file-card .info { flex: 1; min-width: 0; }
  .file-card .fname {
    font-size: 15px; color: #1c1c1e; max-height: 40px; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all;
  }
  .file-card .fsize { margin-top: 4px; font-size: 12px; color: #8a8f99; }
  .file-icon { flex: 0 0 auto; font-size: 26px; color: #9aa3ae; }
  .file-icon svg { width: 40px; height: 40px; display: block; }

  /* 输入区 */
  .inputbar { flex: 0 0 auto; background: #fff; border-top: 1px solid #ededed; padding: 8px 10px 6px; }
  .input-row { display: flex; align-items: center; gap: 8px; }
  .input-row input[type="text"] {
    flex: 1; height: 40px; border: 1px solid #e5e5e5; border-radius: 18px;
    padding: 0 14px; font-size: 15px; outline: none; background: #fff;
  }
  .send-btn {
    height: 40px; padding: 0 18px; border: none; border-radius: 8px;
    background: #12b7f5; color: #fff; font-size: 15px;
  }
  .tools { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .tool-btn {
    width: 40px; height: 40px; border: none; background: transparent;
    font-size: 21px; color: #5b6069; padding: 0;
  }
  /* SVG 图标统一尺寸与居中 */
  #header .icon-btn svg { width: 22px; height: 22px; display: block; margin: 0 auto; }
  .tool-btn svg { width: 24px; height: 24px; display: block; margin: 0 auto; }
  .file-icon svg { width: 28px; height: 28px; display: block; }
  .invite-cell .invite-icon svg { width: 22px; height: 22px; display: block; }
  .quote-bar .qc svg { width: 16px; height: 16px; display: block; }
  .emoji-panel {
    display: none; grid-template-columns: repeat(8, 1fr); gap: 2px;
    padding: 6px 0 2px; max-height: 190px; overflow-y: auto;
  }
  .emoji-panel.show { display: grid; }
  .emoji-panel button { height: 42px; border: none; background: transparent; padding: 2px; }
  .emoji-panel img { width: 100%; height: 100%; object-fit: contain; }
  .emoji-empty { grid-column: 1 / -1; padding: 14px 0; text-align: center; font-size: 13px; color: #8a8f99; }

  /* 输入区引用条 / 待发送表情 */
  .quote-bar {
    display: none; align-items: center; gap: 8px; margin: 0 2px 6px;
    padding: 6px 10px; border-radius: 8px; background: #f2f3f5;
    font-size: 12px; color: #8a8f99;
  }
  .quote-bar.show { display: flex; }
  .quote-bar .qt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quote-bar .qc { flex: 0 0 auto; padding: 0 2px; font-size: 17px; color: #b0b3b8; }
  /* 输入框：可编辑区域，支持文字与表情混排 */
  .input-editor {
    flex: 1; min-height: 40px; max-height: 96px; overflow-y: auto;
    padding: 9px 14px; border: 1px solid #e5e5e5; border-radius: 18px;
    background: #fff; font-size: 15px; line-height: 22px; outline: none;
    word-break: break-word; white-space: pre-wrap;
  }
  .input-editor:empty::before {
    content: attr(data-placeholder); color: #b0b3b8; pointer-events: none;
  }
  .input-editor .input-emoji {
    width: 26px; height: 26px; vertical-align: -7px; margin: 0 1px;
    display: inline-block;
  }

  /* —— 群作业 —— */
  .hdr-text { font-size: 15px; color: #12b7f5; white-space: nowrap; }
  #menuBtn.txt { width: auto; min-width: 40px; padding: 0 4px; }
  .work-body {
    flex: 1; min-height: 0; overflow-y: auto; background: #f2f3f5;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 14px;              /* 列表末尾与底部标签栏留出间距 */
  }
  .work-tabs { display: flex; background: #fff; border-bottom: 1px solid #ededed; }
  .work-tab {
    flex: 1; padding: 12px 0; text-align: center; font-size: 14px;
    color: #6b7078; position: relative;
  }
  .work-tab.on { color: #12b7f5; font-weight: 600; }
  .work-tab.on::after {
    content: ''; position: absolute; left: 50%; bottom: 0; width: 28px;
    height: 3px; margin-left: -14px; border-radius: 2px; background: #12b7f5;
  }
  .work-list { padding: 6px 12px 20px; }
  .work-day { margin: 12px 2px 8px; font-size: 12px; color: #8a8f99; }
  .work-card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .wc-head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #8a8f99; }
  .wc-subject {
    width: 22px; height: 22px; border-radius: 5px; color: #fff; font-size: 12px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .wc-status { margin-left: auto; }
  .wc-status.todo { color: #12b7f5; }
  .wc-status.done { color: #34c759; }
  .wc-status.warn { color: #ff9500; }
  .wc-status.muted { color: #a8adb6; }
  .wc-title { margin-top: 10px; font-size: 15px; font-weight: 600; color: #1c1c1e; line-height: 1.45; }
  .wc-text {
    margin-top: 6px; font-size: 13px; color: #6b7078; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .wc-foot {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0f0f0;
    font-size: 12px; color: #12b7f5; text-align: center;
  }
  .work-empty { padding: 40px 0; text-align: center; color: #a8adb6; font-size: 13px; }
  .work-detail { padding: 12px 12px 24px; }
  .wd-card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .wd-head { display: flex; align-items: center; gap: 8px; }
  .wd-title { font-size: 16px; font-weight: 600; color: #1c1c1e; }
  .wd-meta { margin-top: 6px; font-size: 12px; color: #a8adb6; }
  .wd-content { margin-top: 12px; font-size: 14px; color: #3a3f47; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .wd-sec { margin: 16px 4px 8px; font-size: 13px; color: #8a8f99; }
  .wd-sub { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #f2f2f2; }
  .wd-sub:last-child { border-bottom: none; }
  .wd-sub-main { flex: 1; min-width: 0; margin-left: 10px; }
  .wd-sub-name { font-size: 14px; color: #1c1c1e; }
  .wd-sub-text { margin-top: 3px; font-size: 12px; color: #8a8f99; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wd-badge { font-size: 11px; color: #34c759; margin-left: 6px; }
  .wd-btn {
    padding: 6px 12px; border: 1px solid #12b7f5; border-radius: 14px;
    background: #fff; color: #12b7f5; font-size: 12px;
  }
  .wd-main-btn {
    width: 100%; margin-top: 14px; padding: 12px; border: none; border-radius: 10px;
    background: #12b7f5; color: #fff; font-size: 15px;
  }
  .wd-del { margin-top: 10px; width: 100%; padding: 12px; border: none; border-radius: 10px; background: #fff; color: #ff3b30; font-size: 15px; }
  .work-form { padding: 16px 14px; }
  .wf-row { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 10px; padding: 12px; }
  .wf-subject { width: 30px; height: 30px; border: none; border-radius: 6px; color: #fff; font-size: 14px; }
  .wf-row input { flex: 1; border: none; outline: none; font-size: 15px; color: #1c1c1e; background: transparent; }
  .wf-content {
    width: 100%; min-height: 220px; margin-top: 12px; padding: 14px; border: none;
    border-radius: 10px; outline: none; resize: none; font-size: 15px; line-height: 1.6;
    color: #1c1c1e; background: #fff; box-sizing: border-box;
  }
  .wf-switch {
    display: flex; align-items: center; justify-content: space-between; margin-top: 12px;
    padding: 14px; background: #fff; border-radius: 10px; font-size: 14px; color: #1c1c1e;
  }
  .wf-switch input { width: 20px; height: 20px; accent-color: #12b7f5; }
  .hw-card { width: 220px; max-width: 100%; background: #fff; border-radius: 10px; overflow: hidden; }
  .hw-main { display: flex; align-items: center; gap: 10px; padding: 12px; }
  .hw-title { flex: 1; font-size: 14px; color: #1c1c1e; line-height: 1.4; word-break: break-word; }
  .hw-icon {
    width: 40px; height: 40px; flex: 0 0 auto; border-radius: 8px; color: #fff;
    font-size: 18px; display: flex; align-items: center; justify-content: center;
  }
  .hw-foot { display: flex; align-items: center; gap: 4px; padding: 7px 12px; border-top: 1px solid #f2f2f2; font-size: 11px; color: #8a8f99; }
  .hw-foot svg { width: 12px; height: 12px; }
  /* 通用底部弹窗（选科目 / 提交 / 批改） */
  .dlg-mask { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); z-index: 100; display: flex; align-items: flex-end; }
  .dlg {
    width: 100%; max-height: 80vh; overflow-y: auto; background: #fff;
    border-radius: 14px 14px 0 0; box-sizing: border-box;
    padding: 16px 16px 26px;
    padding-bottom: calc(26px + env(safe-area-inset-bottom, 0px));   /* 底部按钮避开手势条 */
  }
  .dlg h3 { font-size: 16px; text-align: center; margin-bottom: 12px; }
  .dlg-item { padding: 13px 4px; font-size: 15px; border-bottom: 1px solid #f2f2f2; display: flex; align-items: center; justify-content: space-between; }
  .dlg-item:last-child { border-bottom: none; }
  .dlg-item:active { background: #f7f7f8; }
  .dlg-arrow { color: #c7ccd4; display: flex; align-items: center; }
  .dlg-arrow svg { width: 16px; height: 16px; }
  .dlg .check { color: #12b7f5; }
  .dlg textarea, .dlg input[type="text"] {
    width: 100%; padding: 10px; border: 1px solid #e5e5e5; border-radius: 8px;
    font-size: 14px; outline: none; box-sizing: border-box;
  }
  .dlg textarea { min-height: 120px; resize: none; margin-top: 10px; line-height: 1.6; }
  .dlg-grades { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .dlg-grade { padding: 7px 14px; border: 1px solid #e0e2e6; border-radius: 16px; font-size: 13px; color: #3a3f47; background: #fff; }
  .dlg-grade.on { border-color: #12b7f5; color: #12b7f5; background: #eaf7fe; }
  .dlg-actions { display: flex; gap: 10px; margin-top: 14px; }
  .dlg-actions button { flex: 1; padding: 11px; border: none; border-radius: 9px; font-size: 15px; }
  .dlg-actions .cancel { background: #f2f3f5; color: #1c1c1e; }
  .dlg-actions .ok { background: #12b7f5; color: #fff; }

  /* —— 底部标签栏（消息 / 联系人） —— */
  #tabbar {
    flex: 0 0 auto; display: flex; background: #fff; border-top: 1px solid #ededed;
    padding-bottom: env(safe-area-inset-bottom, 0px);   /* 适配全面屏手势条 */
  }
  #tabbar.hide { display: none; }
  .tab-item {
    flex: 1; height: 52px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 1px; padding: 0; border: none;
    background: transparent; font-size: 10px; line-height: 1; color: #8a8f99;
  }
  .tab-item:active { background: #f7f7f8; }
  .tab-item.on { color: #12b7f5; }
  .tab-item svg { width: 22px; height: 22px; }
  /* —— 联系人 / 新朋友 —— */
  .contact-sec { margin: 10px 12px 0; background: #fff; border-radius: 12px; overflow: hidden; }
  .contact-row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #f2f2f2; }
  .contact-row:last-child { border-bottom: none; }
  .contact-row:active { background: #f7f7f8; }
  .contact-row .name {
    flex: 1; min-width: 0; font-size: 15px; color: #1c1c1e;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .contact-row .name .sub {
    margin-top: 3px; font-size: 11px; color: #a8adb6;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .contact-row > svg { width: 16px; height: 16px; flex: 0 0 auto; color: #c7ccd4; }
  .row-avatar svg { width: 20px; height: 20px; }
  .row-avatar { width: 38px; height: 38px; flex: 0 0 auto; }
  .row-avatar .avatar-text { font-size: 15px; }
  .online-dot { width: 7px; height: 7px; border-radius: 50%; background: #34c759; display: inline-block; margin-right: 5px; }
  .sec-title { margin: 16px 16px 6px; font-size: 12px; color: #8a8f99; }
  .badge-dot {
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: #ff3b30; color: #fff; font-size: 11px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .pu-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f2f2f2; }
  .pu-row:active { background: #f7f7f8; }
  #puList { max-height: 42vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }  /* 结果区独立滚动，搜索框始终可见 */
  .pu-row .pu-name { flex: 1; font-size: 14px; color: #1c1c1e; }
  .pu-row .pu-name i { display: block; font-style: normal; font-size: 11px; color: #a8adb6; }
  .pu-check {
    width: 20px; height: 20px; border: 1px solid #d5d8dd; border-radius: 50%;
    color: transparent; font-size: 12px; display: flex; align-items: center; justify-content: center;
  }
  .pu-check.on { background: #12b7f5; border-color: #12b7f5; color: #fff; }
  .pu-check svg { width: 13px; height: 13px; }
  .fr-btn { padding: 8px 14px; border-radius: 15px; border: 1px solid #12b7f5; color: #12b7f5; background: #fff; font-size: 12px; }
  .fr-btn.primary { background: #12b7f5; color: #fff; }

  /* 消息长按菜单 */
  #ctxMask { display: none; position: fixed; inset: 0; z-index: 70; }
  #ctxMask.show { display: block; }
  .ctx-menu {
    position: absolute; min-width: 138px; padding: 4px 0; border-radius: 10px;
    background: #fff; box-shadow: 0 6px 24px rgba(0, 0, 0, .18); overflow: hidden;
  }
  .ctx-item { padding: 11px 18px; font-size: 15px; color: #1c1c1e; }
  .ctx-item:active { background: #f2f3f5; }
  .ctx-item.danger { color: #ff3b30; }
  .ctx-divider { height: 1px; margin: 4px 0; background: #efeff0; }

  /* 设置页 / 邀请页 */
  .page { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #f2f3f5; padding: 12px; }
  .card { background: #fff; border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
  .section-title { padding: 12px 14px 4px; font-size: 13px; color: #8a8f99; }
  .member-grid { display: flex; flex-wrap: wrap; padding: 0 12px 12px; }
  .member-cell { width: 20%; padding-top: 8px; display: flex; flex-direction: column; align-items: center; }
  .member-cell .avatar-box { width: 44px; height: 44px; }
  .member-cell .mname {
    margin-top: 4px; max-width: 100%; font-size: 11px; color: #8a8f99;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .invite-cell .invite-icon {
    width: 44px; height: 44px; border-radius: 12px; background: #f2f3f5;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #8a8f99;
  }
  .row { display: flex; align-items: center; padding: 14px; }
  .row .label { font-size: 15px; color: #1c1c1e; }
  .row .value {
    flex: 1; margin-left: 12px; text-align: right; font-size: 14px; color: #8a8f99;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row .arrow { margin-left: 6px; color: #c7cbd1; font-size: 18px; }
  .row .arrow svg { width: 16px; height: 16px; display: block; }
  .divider { height: 1px; background: #efeff0; margin-left: 14px; }
  .switch { position: relative; width: 46px; height: 26px; flex: 0 0 auto; }
  .switch input { display: none; }
  .switch i {
    position: absolute; inset: 0; border-radius: 13px; background: #d9dde3; transition: background .2s;
  }
  .switch i::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px;
    border-radius: 50%; background: #fff; transition: transform .2s;
  }
  .switch input:checked + i { background: #12b7f5; }
  .switch input:checked + i::after { transform: translateX(20px); }

  .invite-search { padding: 8px 12px; background: #fff; }
  .invite-search input {
    width: 100%; height: 36px; border: none; outline: none; border-radius: 18px;
    background: #f2f3f5; padding: 0 14px; font-size: 14px;
  }
  .invite-list { flex: 1; overflow-y: auto; background: #fff; }
  .invite-row { display: flex; align-items: center; padding: 10px 16px; }
  .invite-row .avatar-box { width: 40px; height: 40px; }
  .invite-row .iname { flex: 1; margin-left: 12px; font-size: 15px; }
  .check {
    width: 22px; height: 22px; border-radius: 50%; border: 1px solid #d0d3d8;
    display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff;
  }
  .check.on { background: #12b7f5; border-color: #12b7f5; }
  .check svg { width: 14px; height: 14px; display: block; }
  .invite-submit {
    flex: 0 0 auto; margin: 8px 12px 12px; height: 46px; border: none; border-radius: 8px;
    background: #12b7f5; color: #fff; font-size: 16px;
  }

  .loading, .empty { padding: 60px 0; text-align: center; font-size: 14px; color: #8a8f99; }

  /* 图片全屏预览 */
  #viewer {
    position: fixed; inset: 0; z-index: 200; display: none;
    background: rgba(0, 0, 0, .96); align-items: center; justify-content: center;
  }
  #viewer img { max-width: 100%; max-height: 100%; }
  /* 预览页保存按钮：固定在右上角，避免与点击关闭手势冲突 */
  #viewerSave {
    position: absolute; top: 16px; right: 16px; padding: 8px 14px;
    border-radius: 18px; background: rgba(255, 255, 255, .18); color: #fff;
    font-size: 14px;
  }
  #toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    max-width: 80%; padding: 10px 16px; border-radius: 8px; z-index: 300;
    background: rgba(0, 0, 0, .78); color: #fff; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; }

  /* 危险操作行（解散群聊）：文字居中、红色提示 */
  .danger-row { justify-content: center; }
  .danger-row .label { color: #e5484d; font-weight: 500; }

  /* 宽屏左栏顶部：消息 / 联系人切换（替代被隐藏的底部标签栏） */
  .side-tabs { display: flex; gap: 6px; padding: 8px 10px 2px; }
  .side-tabs button {
    flex: 1; height: 32px; border: 0; border-radius: 16px;
    background: #f2f3f5; color: #5c6370; font-size: 13px; font-family: inherit;
  }
  .side-tabs button.on { background: #e8f3ff; color: #1c7cff; font-weight: 500; }

  /* ============ 屏幕尺寸适配 ============ */

  /* 窄屏（≤360dp，如 5.0/5.5 英寸机型）：压缩留白、减小列数，避免内容被挤压 */
  @media (max-width: 360px) {
    .msgs { padding: 10px 8px; }
    .msg-col { max-width: 76%; }
    .msg .avatar-box { width: 36px; height: 36px; }
    .bubble { font-size: 14px; }
    .bubble.media img { max-width: 68vw; }
    .file-card { width: 206px; }
    .hw-card { width: 200px; }
    .emoji-panel { grid-template-columns: repeat(7, 1fr); }
    .emoji-panel button { height: 38px; }
    .conv-name { font-size: 15px; }
    .conv-preview { font-size: 13px; }
    .send-btn { padding: 0 13px; }
    .tool-btn { width: 36px; }
    .contact-row { padding: 11px 12px; }
  }

  /* 横屏且高度很小：收紧输入区与表情面板，保证聊天内容可见 */
  @media (orientation: landscape) and (max-height: 430px) {
    .emoji-panel { max-height: 108px; }
    .input-editor { max-height: 66px; }
    .tools { margin-top: 4px; }
    .tool-btn { height: 34px; }
  }

  /* 平板 / 网页版双栏布局（≥768px 与网页版断点一致）：
     左侧常驻会话列表，右侧显示聊天 / 联系人 / 作业等页面 */
  @media (min-width: 768px) {
    #app {
      display: grid;
      grid-template-columns: 300px 1fr;
      grid-template-rows: 52px 1fr;
    }
    #header { grid-column: 1 / -1; grid-row: 1; }
    #side {
      display: flex; flex-direction: column; min-height: 0;
      grid-column: 1; grid-row: 2;
      background: #fff; border-right: 1px solid #ededed;
    }
    #main { grid-column: 2; grid-row: 2; }
    #tabbar { display: none !important; }          /* 宽屏用左栏切换，不再显示底部标签栏 */
    .wide-empty {
      flex: 1; display: flex; align-items: center; justify-content: center;
      background: #f7f7f8; color: #b0b3b8; font-size: 14px;
    }
    .dlg { max-width: 480px; margin: 0 auto; }     /* 底部弹窗跟随内容宽度居中 */
  }
</style>
</head>
<body>
<div id="app">
  <header id="header">
    <button id="backBtn" class="icon-btn" style="visibility:hidden"></button>
    <div id="title" class="title">邻语</div>
    <button id="menuBtn" class="icon-btn" style="visibility:hidden"></button>
  </header>
  <aside id="side"></aside>
  <main id="main"></main>
  <nav id="tabbar">
    <button class="tab-item on" data-tab="list" id="tabMsgs"></button>
    <button class="tab-item" data-tab="contacts" id="tabContacts"></button>
  </nav>
</div>
<div id="viewer"><div id="viewerSave">保存图片</div><img id="viewerImg" alt=""></div>
<div id="ctxMask"><div class="ctx-menu" id="ctxMenu"></div></div>
<div id="toast"></div>

<script>
(function () {
  'use strict';

  /* ==================== 环境与状态 ==================== */
  var bridge = window.ImBridge || null;                    // 原生桥（WebView 注入）
  var BASE = bridge ? bridge.getBaseUrl() : location.origin; // 服务端根地址
  var TOKEN = bridge ? bridge.getToken() : '';             // 登录令牌
  var MY_ID = bridge ? bridge.getMyId() : '';              // 当前用户 ID
  var API = BASE + '/im/api';                              // 邻语接口前缀

  var state = {
    view: 'list',            // list / chat / settings / invite
    convs: [],               // 会话列表数据
    convQuery: '',           // 会话搜索关键词
    convId: '',              // 当前会话 ID
    convTitle: '',           // 当前会话标题
    isGroup: false,          // 当前是否群聊
    msgs: [],                // 当前消息数组
    lastSig: '',             // 消息签名（判断是否需要重绘）
    detail: null,            // 当前会话详情
    chatFrom: 'list',        // 进入聊天页的来源：list / contacts（决定返回层级）
    friendsFrom: 'contacts', // 进入「新朋友」页的来源：list / contacts（决定返回层级）
    inviteUsers: [],         // 邀请搜索结果
    inviteSelected: {},      // 邀请已勾选用户 ID
    viewerSrc: '',           // 正在预览的图片地址（blob）
    viewerPath: '',          // 正在预览的图片接口路径（用于保存原图）
    quote: null,             // 当前引用回复的目标消息 { id, name, text }
    me: {}                   // 当前登录用户信息（isAdmin 等，用于权限判断）
  };

  var listTimer = null;      // 会话列表轮询
  var chatTimer = null;      // 聊天轮询
  var inviteTimer = null;    // 邀请搜索防抖
  var imgCache = {};         // 受保护图片的 blob 地址缓存
  var emojiCodes = null;     // 服务端表情编码列表（加载一次后复用）

  /** 内联 SVG 图标：统一使用 currentColor，避免额外图片资源与拉伸模糊 */
  var ICONS = {
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
    image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M4 17l4.8-4.8a1 1 0 0 1 1.4 0L14 16"/><path d="M13.4 15.4l2.4-2.4a1 1 0 0 1 1.4 0L21 16.6"/></svg>',
    file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h6l5 5v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 3v5h5"/></svg>',
    emoji: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/><circle cx="9" cy="9.5" r="1"/><circle cx="15" cy="9.5" r="1"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    homework: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2.2"/><path d="M9 3.2h6v3.2H9z"/><path d="M9 11.2h6M9 15h4"/></svg>',
    msgs: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h16v10.5H9l-4 3.2V16H4z"/><path d="M8 9.5h8M8 12.6h5"/></svg>',
    contacts: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.3"/><path d="M5 19.5c.7-3.3 3.4-5 7-5s6.3 1.7 7 5"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
  };

  /* 文件卡片图标按类型区分：视频 / 压缩包 / 文件夹 / 文档 / 未知 */
  var FILE_ICONS = {
    video: '<svg viewBox="0 0 48 48" fill="none"><path d="M10 5h17l11 11v26a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z" fill="#FFF7F7" stroke="#F3BDBD" stroke-width="1.8"/><path d="M27 5v8a3 3 0 0 0 3 3h8" stroke="#F3BDBD" stroke-width="1.8"/><path d="M20 17.5l9.5 6.5-9.5 6.5z" fill="#EC5B5B"/></svg>',
    zip: '<svg viewBox="0 0 48 48" fill="none"><rect x="8" y="8" width="32" height="32" rx="7" fill="#67B6F9"/><g fill="#fff"><rect x="21" y="11" width="3" height="3" rx=".8"/><rect x="24" y="14" width="3" height="3" rx=".8"/><rect x="21" y="17" width="3" height="3" rx=".8"/><rect x="24" y="20" width="3" height="3" rx=".8"/><rect x="20.5" y="23.5" width="4" height="4" rx="1.2"/></g><text x="24" y="37.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#fff">ZIP</text></svg>',
    folder: '<svg viewBox="0 0 48 48" fill="none"><path d="M5 12a4 4 0 0 1 4-4h9.5l4.5 5H39a4 4 0 0 1 4 4v21a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V12z" fill="#67B6F9"/><rect x="12" y="19" width="24" height="7" rx="3.5" fill="#fff" fill-opacity=".92"/></svg>',
    doc: '<svg viewBox="0 0 48 48" fill="none"><path d="M10 5h17l11 11v26a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z" fill="#fff" stroke="#C9CED5" stroke-width="1.8"/><path d="M27 5v8a3 3 0 0 0 3 3h8" stroke="#C9CED5" stroke-width="1.8"/><rect x="14" y="22" width="20" height="3.2" rx="1.6" fill="#B0B6BF"/><rect x="14" y="29" width="14" height="3.2" rx="1.6" fill="#B0B6BF"/></svg>',
    unknown: '<svg viewBox="0 0 48 48" fill="none"><path d="M10 5h17l11 11v26a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z" fill="#fff" stroke="#D3D7DD" stroke-width="1.8"/><path d="M27 5v8a3 3 0 0 0 3 3h8" stroke="#D3D7DD" stroke-width="1.8"/><rect x="14" y="21" width="14" height="3.2" rx="1.6" fill="#B0B6BF"/><rect x="14" y="28" width="9" height="3.2" rx="1.6" fill="#B0B6BF"/><rect x="14" y="35" width="7" height="3.2" rx="1.6" fill="#B0B6BF"/><text x="29" y="39" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#B0B6BF">?</text></svg>'
  };

  /** 视频类扩展名 */
  var VIDEO_EXT = ['mp4', 'mov', 'm4v', 'avi', 'mkv', 'wmv', 'flv', 'webm', '3gp', 'rmvb', 'ts'];
  /** 压缩包类扩展名 */
  var ARCHIVE_EXT = ['zip', 'rar', '7z', 'tar', 'gz', 'bz2', 'xz', 'iso'];
  /** 常见文档扩展名（与未知类型区分展示） */
  var DOC_EXT = ['pdf', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'txt', 'md', 'csv'];

  /**
   * 按文件名挑选文件类型图标
   * @param {string} name 文件名
   * @returns {string} 内联 SVG 字符串
   */
  function fileIconSvg(name) {
    var str = String(name || '');
    var dot = str.lastIndexOf('.');
    if (str && dot <= 0) return FILE_ICONS.folder;        // 无扩展名视为文件夹
    var ext = dot > 0 ? str.slice(dot + 1).toLowerCase() : '';
    if (VIDEO_EXT.indexOf(ext) >= 0) return FILE_ICONS.video;
    if (ARCHIVE_EXT.indexOf(ext) >= 0) return FILE_ICONS.zip;
    if (DOC_EXT.indexOf(ext) >= 0) return FILE_ICONS.doc;
    return FILE_ICONS.unknown;
  }

  var main = document.getElementById('main');
  var titleEl = document.getElementById('title');
  var backBtn = document.getElementById('backBtn');
  var menuBtn = document.getElementById('menuBtn');
  var viewer = document.getElementById('viewer');
  var viewerImg = document.getElementById('viewerImg');
  var viewerSave = document.getElementById('viewerSave');
  var toastEl = document.getElementById('toast');
  var tabbar = document.getElementById('tabbar');

  // 顶栏返回键与菜单键使用 SVG 图标
  backBtn.innerHTML = ICONS.back;
  menuBtn.innerHTML = ICONS.menu;
  // 底部标签栏图标
  document.getElementById('tabMsgs').innerHTML = ICONS.msgs + '<span>消息</span>';
  document.getElementById('tabContacts').innerHTML = ICONS.contacts + '<span>联系人</span>';
  tabbar.addEventListener('click', function (ev) {
    var btn = ev.target.closest('[data-tab]');
    if (!btn) return;
    if (btn.getAttribute('data-tab') === 'contacts') {
      openContacts();
    } else {
      renderList();
    }
  });

  // 记录输入框光标位置（点表情面板会使输入框失焦，插入表情时用它还原）
  document.addEventListener('selectionchange', function () {
    var ed = document.getElementById('msgInput');
    var sel = window.getSelection();
    if (ed && sel && sel.rangeCount && ed.contains(sel.getRangeAt(0).commonAncestorContainer)) {
      savedRange = sel.getRangeAt(0).cloneRange();
    }
  });

  /* ==================== 通用工具 ==================== */
  /** HTML 转义，防止消息内容破坏结构 */
  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /** URL 编码 */
  function enc(value) {
    return encodeURIComponent(String(value));
  }

  /** 轻提示 */
  function toast(message) {
    toastEl.textContent = message;
    toastEl.classList.add('show');
    clearTimeout(toastEl._timer);
    toastEl._timer = setTimeout(function () { toastEl.classList.remove('show'); }, 2000);
  }

  /** 统一接口请求：自动携带令牌，统一解析 ok/data */
  function api(path, options) {
    options = options || {};
    var headers = {
      'Authorization': 'Bearer ' + TOKEN,
      'X-Client-Type': 'MingxingSchool-Android'
    };
    if (options.body) {
      headers['Content-Type'] = 'application/json';
    }
    return fetch(API + path, {
      method: options.method || 'GET',
      headers: headers,
      body: options.body ? JSON.stringify(options.body) : undefined
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (json) {
        if (!res.ok || json.ok === false) {
          var msg = (json.error && json.error.message) || ('请求失败（' + res.status + '）');
          throw new Error(msg);
        }
        return json.data;
      });
    });
  }

  /** 带登录令牌的图片地址（头像、聊天图片需要鉴权，转为 blob 地址） */
  function authImgUrl(path) {
    if (!path) return Promise.resolve('');
    if (imgCache[path]) return Promise.resolve(imgCache[path]);
    var full = path.indexOf('http') === 0 ? path : BASE + path;
    return fetch(full, { headers: { 'Authorization': 'Bearer ' + TOKEN } })
      .then(function (res) {
        if (!res.ok) return '';
        return res.blob().then(function (blob) {
          var url = URL.createObjectURL(blob);
          imgCache[path] = url;
          return url;
        });
      })
      .catch(function () { return ''; });
  }

  /** 为容器内所有 [data-auth] 图片补充真实地址 */
  function hydrateImages(root) {
    var list = root.querySelectorAll('img[data-auth]');
    for (var i = 0; i < list.length; i++) {
      (function (img) {
        var path = img.getAttribute('data-auth');
        if (!path || img.getAttribute('data-loading')) return;
        img.setAttribute('data-loading', '1');
        authImgUrl(path).then(function (url) {
          if (url) {
            img.src = url;
            img.style.display = 'block';   // 头像图片加载成功后覆盖首字占位
          }
        });
      })(list[i]);
    }
  }

  /** 生成头像 HTML：有地址用图片（鉴权加载），否则用无背景的首字占位 */
  function avatarHtml(path, name, cls) {
    var text = String(name || '?').trim().charAt(0) || '?';
    if (!path) {
      return '<div class="' + (cls || 'avatar') + ' avatar-text">'
        + esc(text) + '</div>';
    }
    return '<div class="' + (cls || 'avatar') + ' avatar-text">'
      + esc(text) + '<img data-auth="' + esc(path) + '" data-avatar="1" alt=""></div>';
  }

  /** 解析服务端 ISO 时间 */
  function parseTime(iso) {
    if (!iso) return 0;
    var t = Date.parse(iso);
    return isNaN(t) ? 0 : t;
  }

  /** 会话列表时间：当天 HH:mm，其他 MM/dd */
  function fmtConvTime(iso) {
    var t = parseTime(iso);
    if (!t) return '';
    var d = new Date(t);
    var now = new Date();
    var sameDay = d.getFullYear() === now.getFullYear()
      && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) && sameDay
      ? pad(d.getHours()) + ':' + pad(d.getMinutes())
      : pad(d.getMonth() + 1) + '/' + pad(d.getDate());
  }

  /** 聊天页时间：当天 HH:mm，今年 MM/dd HH:mm，跨年 yyyy/MM/dd HH:mm */
  function fmtChatTime(t) {
    var d = new Date(t);
    var now = new Date();
    if (d.getFullYear() === now.getFullYear()) {
      var sameDay = d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
      return sameDay
        ? pad(d.getHours()) + ':' + pad(d.getMinutes())
        : pad(d.getMonth() + 1) + '/' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }
    return d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate())
      + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /** 两位补零 */
  function pad(n) {
    return n < 10 ? '0' + n : '' + n;
  }

  /** 文件大小格式化 */
  function fmtSize(size) {
    if (!size) return '0 B';
    if (size < 1024) return size + ' B';
    if (size < 1024 * 1024) return (size / 1024).toFixed(1) + ' KB';
    return (size / 1024 / 1024).toFixed(2) + ' MB';
  }

  /** 设置顶栏：标题、返回按钮与菜单按钮显隐 */
  function setHeader(title, showBack, showMenu) {
    titleEl.textContent = title;
    backBtn.style.visibility = showBack ? 'visible' : 'hidden';
    menuBtn.style.visibility = showMenu ? 'visible' : 'hidden';
    resetHeaderAction();
    updateTabbar();
  }

  /** 底部标签栏：仅消息列表与联系人页显示，并同步高亮项 */
  function updateTabbar() {
    var visible = state.view === 'list' || state.view === 'contacts';
    tabbar.classList.toggle('hide', !visible);
    tabbar.querySelectorAll('.tab-item').forEach(function (el) {
      el.classList.toggle('on', el.getAttribute('data-tab')
        === (state.view === 'contacts' ? 'contacts' : 'list'));
    });
  }

  /**
   * 把顶栏右侧按钮切换成图标按钮（消息首页的「+」）
   * @param {string} icon SVG 字符串
   * @param {Function} handler 点击回调
   */
  function setHeaderIcon(icon, handler) {
    headerAction = handler;
    menuBtn.classList.remove('txt');
    menuBtn.style.visibility = 'visible';
    menuBtn.innerHTML = icon;
  }

  /** 顶栏右侧文字按钮的回调（null 表示使用默认菜单图标） */
  var headerAction = null;

  /**
   * 把顶栏右侧按钮切换成文字按钮（作业页的「布置」、发布页的「发布」）
   * @param {string} label 按钮文字
   * @param {Function} handler 点击回调
   */
  function setHeaderText(label, handler) {
    headerAction = handler;
    menuBtn.classList.add('txt');
    menuBtn.style.visibility = 'visible';
    menuBtn.innerHTML = '<span class="hdr-text">' + esc(label) + '</span>';
  }

  /** 还原顶栏右侧按钮为默认菜单图标 */
  function resetHeaderAction() {
    headerAction = null;
    menuBtn.classList.remove('txt');
    menuBtn.innerHTML = ICONS.menu;
  }

  /** 判断消息区是否接近底部（决定新消息是否自动滚动到底） */
  function isNearBottom(el) {
    return el.scrollHeight - el.scrollTop - el.clientHeight < 120;
  }

  /* ==================== 会话列表 ==================== */
  /**
   * 是否宽屏（平板 / 横屏）：≥768px 时采用与网页版一致的双栏布局
   * @returns {boolean}
   */
  function isWide() {
    return window.innerWidth >= 768;
  }

  /**
   * 切换宽屏左栏顶部的高亮项
   * @param {'msgs'|'contacts'} which 当前选中的标签
   */
  function markSideTab(which) {
    var msgs = document.getElementById('sideMsgs');          // 消息标签
    var contacts = document.getElementById('sideContacts');  // 联系人标签
    if (msgs) msgs.classList.toggle('on', which === 'msgs');
    if (contacts) contacts.classList.toggle('on', which === 'contacts');
  }

  /**
   * 渲染宽屏左栏：消息/联系人切换 + 搜索框 + 会话列表（常驻，不随右栏页面切换而消失）
   */
  function renderSidebar() {
    var side = document.getElementById('side');
    if (!side) return;
    side.innerHTML =
      '<div class="side-tabs">'
      + '<button id="sideMsgs" class="on">消息</button>'
      + '<button id="sideContacts">联系人</button>'
      + '</div>'
      + '<div class="search-bar"><input id="convSearch" placeholder="搜索" value="' + esc(state.convQuery) + '"></div>'
      + '<div class="list" id="convList"></div>';
    var search = document.getElementById('convSearch');
    search.addEventListener('input', function () {
      state.convQuery = search.value.trim();
      renderConvRows();
    });
    // 顶部标签：消息 / 联系人（宽屏隐藏了底部标签栏，这里是联系人入口）
    document.getElementById('sideMsgs').addEventListener('click', function () {
      markSideTab('msgs');
      // 右栏若不在聊天页，回到欢迎提示
      if (state.view !== 'chat') {
        state.view = 'list';
        main.innerHTML = '<div class="wide-empty">选择一个会话开始聊天</div>';
      }
    });
    document.getElementById('sideContacts').addEventListener('click', function () {
      openContacts();
    });
    markSideTab(state.view === 'contacts' || state.view === 'friends' ? 'contacts' : 'msgs');
    renderConvRows();
  }

  /**
   * 渲染会话列表
   */
  function renderList() {
    state.view = 'list';
    state.convId = '';
    state.chatFrom = 'list';                       // 从消息列表进入聊天
    stopChatPoll();
    setHeader('邻语', false, false);
    setHeaderIcon(ICONS.plus, openAddMenu);
    // 通知原生：已回到列表，后台新消息需要正常提醒
    if (bridge && bridge.setCurrentConv) bridge.setCurrentConv('');

    // 宽屏双栏：左栏常驻会话列表，右栏显示欢迎提示
    if (isWide()) {
      renderSidebar();
      main.innerHTML = '<div class="wide-empty">选择一个会话开始聊天</div>';
      loadConvs();
      startListPoll();
      return;
    }

    main.innerHTML =
      '<div class="search-bar"><input id="convSearch" placeholder="搜索" value="' + esc(state.convQuery) + '"></div>'
      + '<div class="list" id="convList"></div>';

    var search = document.getElementById('convSearch');
    search.addEventListener('input', function () {
      state.convQuery = search.value.trim();
      renderConvRows();
    });

    renderConvRows();
    loadConvs();
    startListPoll();
  }

  /** 渲染会话行（按搜索词过滤） */
  function renderConvRows() {
    var box = document.getElementById('convList');
    if (!box) return;
    var q = state.convQuery.toLowerCase();
    var html = '';
    var shown = 0;
    state.convs.forEach(function (conv) {
      var title = conv.title || conv.id;
      if (q && title.toLowerCase().indexOf(q) < 0) return;
      shown++;
      var last = conv.lastMessage || null;
      var preview = '';
      if (last) {
        if (last.recalled) {
          preview = '[消息已撤回]';
        } else if (last.parts && last.parts.length && last.parts[0].type === 'file') {
          preview = '[文件] ' + (last.parts[0].name || '');
        } else if (last.parts && last.parts.length && last.parts[0].type === 'image') {
          preview = '[图片]';
        } else if (last.parts && last.parts.length && last.parts[0].type === 'homework') {
          preview = '[作业] ' + (last.parts[0].title || '');
        } else {
          preview = last.text || '';
          if (conv.type === 'group' && last.senderName) preview = last.senderName + '：' + preview;
        }
      }
      var unread = conv.unread || 0;
      html += '<div class="conv" data-conv="' + esc(conv.id) + '" data-title="' + esc(title) + '" data-group="' + (conv.type === 'group' ? '1' : '0') + '">'
        + '<div class="avatar-box">' + avatarHtml(convAvatar(conv), title) + (unread > 0
          ? '<span class="badge">' + (unread > 99 ? '99+' : unread) + '</span>' : '') + '</div>'
        + '<div class="conv-mid"><div class="conv-name">' + esc(title) + '</div>'
        + '<div class="conv-preview">' + esc(preview) + '</div></div>'
        + '<div class="conv-time">' + esc(last ? fmtConvTime(last.time) : '') + '</div>'
        + '</div>';
    });
    box.innerHTML = shown ? html : '<div class="empty">' + (state.convQuery ? '没有找到相关会话' : '暂无会话') + '</div>';
    hydrateImages(box);
  }

  /** 会话头像：群聊取群头像，单聊取对方头像 */
  function convAvatar(conv) {
    if (conv.avatar) return conv.avatar;
    if (conv.type === 'group') return '';
    var members = conv.members || [];
    for (var i = 0; i < members.length; i++) {
      if (members[i].id !== MY_ID) return members[i].avatar || '';
    }
    return '';
  }

  /** 拉取会话列表 */
  function loadConvs() {
    api('/conversations').then(function (list) {
      state.convs = list || [];
      renderConvRows();
    }).catch(function (e) {
      toast(e.message);
    });
  }

  /** 开始会话列表轮询（3 秒） */
  function startListPoll() {
    stopListPoll();
    listTimer = setInterval(function () {
      // 宽屏左栏常驻，聊天中也要继续刷新会话列表
      if (state.view === 'list' || isWide()) loadConvs();
    }, 15000);
  }

  /** 停止会话列表轮询 */
  function stopListPoll() {
    if (listTimer) { clearInterval(listTimer); listTimer = null; }
  }

  /* ==================== 聊天页 ==================== */
  /**
   * 打开聊天页
   * @param {string} id 会话 ID
   * @param {string} title 标题
   * @param {boolean} isGroup 是否群聊
   */
  function openChat(id, title, isGroup) {
    state.view = 'chat';
    state.convId = id;
    state.convTitle = title;
    state.isGroup = isGroup;
    state.msgs = [];
    state.lastSig = '';
    state.quote = null;                              // 切换会话时清空引用
    var wide = isWide();                             // 是否宽屏双栏布局
    if (wide) {
      // 宽屏左栏保持常驻；若左栏尚未渲染（如通知直达会话），先补出来
      if (!document.getElementById('convList')) {
        renderSidebar();
        loadConvs();
        startListPoll();
      }
    } else {
      stopListPoll();
    }
    setHeader(title, !wide, true);                   // 宽屏不需要返回列表按钮
    if (wide) markSideTab('msgs');                   // 宽屏左栏高亮「消息」
    // 通知原生：当前正在查看该会话，避免重复弹通知
    if (bridge && bridge.setCurrentConv) bridge.setCurrentConv(id);

    main.innerHTML =
      '<div class="msgs" id="msgBox"><div class="loading">加载中…</div></div>'
      + '<div class="inputbar">'
      + '  <div class="quote-bar" id="quoteBar"><span class="qt" id="quoteText"></span>'
      + '    <span class="qc" id="quoteClose">' + ICONS.close + '</span></div>'
      + '  <div class="input-row">'
      + '    <div id="msgInput" class="input-editor" contenteditable="true" '
      + '         data-placeholder="发消息…"></div>'
      + '    <button class="send-btn" id="sendBtn">发送</button>'
      + '  </div>'
      + '  <div class="tools">'
      + '    <button class="tool-btn" id="pickImg">' + ICONS.image + '</button>'
      + '    <button class="tool-btn" id="pickFile">' + ICONS.file + '</button>'
      + (isGroup ? '    <button class="tool-btn" id="pickHomework" title="作业">' + ICONS.homework + '</button>' : '')
      + '    <button class="tool-btn" id="pickEmoji">' + ICONS.emoji + '</button>'
      + '  </div>'
      + '  <div class="emoji-panel" id="emojiPanel"></div>'
      + '</div>'
      + '<input type="file" id="imgInput" accept="image/*" style="display:none">'
      + '<input type="file" id="fileInput" style="display:none">';

    bindChatEvents();
    buildEmojiPanel();
    loadMessages(true);
    startChatPoll();
  }

  /** 绑定聊天页事件 */
  function bindChatEvents() {
    var editor = document.getElementById('msgInput');
    document.getElementById('sendBtn').addEventListener('click', function () {
      sendEditor();
    });
    editor.addEventListener('keydown', function (e) {
      // 回车发送，Shift+回车换行
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendEditor();
      }
    });
    // 粘贴只保留纯文本，避免外部富文本破坏排版
    editor.addEventListener('paste', function (e) {
      e.preventDefault();
      var text = (e.clipboardData || window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, text);
    });
    // 点输入框里的表情：移除该表情
    editor.addEventListener('click', function (ev) {
      var emoji = ev.target.closest('img[data-emoji]');
      if (!emoji) return;
      emoji.parentNode.removeChild(emoji);
    });
    // 输入框获得焦点（软键盘弹出）时自动收起表情面板，避免面板与键盘叠加
    editor.addEventListener('focus', function () {
      var panel = document.getElementById('emojiPanel');
      if (panel) panel.classList.remove('show');
    });

    document.getElementById('pickEmoji').addEventListener('click', function () {
      var panel = document.getElementById('emojiPanel');
      var willShow = !panel.classList.contains('show');   // 本次点击后是否会展开
      panel.classList.toggle('show');
      // 展开表情面板时主动收起软键盘，让面板完整可见
      if (willShow) editor.blur();
    });

    var imgInput = document.getElementById('imgInput');
    document.getElementById('pickImg').addEventListener('click', function () { imgInput.click(); });
    imgInput.addEventListener('change', function () {
      var file = imgInput.files[0];
      imgInput.value = '';
      if (file) sendImage(file);
    });

    var fileInput = document.getElementById('fileInput');
    document.getElementById('pickFile').addEventListener('click', function () { fileInput.click(); });

    // 群聊作业入口（单聊不显示）
    var hwBtn = document.getElementById('pickHomework');
    if (hwBtn) {
      hwBtn.addEventListener('click', function () {
        openWork();
      });
    }
    fileInput.addEventListener('change', function () {
      var file = fileInput.files[0];
      fileInput.value = '';
      if (file) sendFile(file);
    });

    // 取消引用
    document.getElementById('quoteClose').addEventListener('click', clearQuote);

    bindLongPress();
  }

  /**
   * 表情面板：加载服务端表情编码，网格展示 APNG 缩略图
   * 图片由原生侧带登录令牌代理加载（/im/emoji 需要登录）
   */
  function buildEmojiPanel() {
    var panel = document.getElementById('emojiPanel');
    if (!panel) return;
    panel.innerHTML = '<div class="emoji-empty">加载中…</div>';

    loadEmojiCodes().then(function (codes) {
      if (!document.getElementById('emojiPanel')) return;   // 页面已切走
      if (!codes.length) {
        panel.innerHTML = '<div class="emoji-empty">暂无表情</div>';
        return;
      }
      panel.innerHTML = codes.map(function (code) {
        return '<button type="button" data-emoji="' + esc(code) + '">'
          + '<img loading="lazy" src="/im/emoji/' + esc(code) + '.png" alt="[表情]"></button>';
      }).join('');
    });

    panel.addEventListener('click', function (ev) {
      var btn = ev.target.closest('button[data-emoji]');
      if (!btn) return;
      insertEmoji(btn.getAttribute('data-emoji'));
      panel.classList.remove('show');
    });
  }

  /**
   * 获取表情编码列表（首次从接口加载，之后复用缓存）
   * @returns {Promise<string[]>} 表情编码数组
   */
  function loadEmojiCodes() {
    if (emojiCodes) return Promise.resolve(emojiCodes);
    return api('/emojis').then(function (list) {
      emojiCodes = list || [];
      return emojiCodes;
    }).catch(function () {
      return [];
    });
  }

  /**
   * 在输入框光标处插入表情图片
   * @param {string} code 表情编码
   */
  function insertEmoji(code) {
    var editor = document.getElementById('msgInput');
    if (!editor) return;
    var img = document.createElement('img');
    img.className = 'input-emoji';
    img.setAttribute('data-emoji', code);
    img.setAttribute('src', '/im/emoji/' + code + '.png');
    img.setAttribute('alt', '[表情]');
    insertAtCaret(editor, img);
    editor.focus();
  }

  /** 输入框最近一次有效光标位置（点表情面板导致失焦时用于还原） */
  var savedRange = null;

  /**
   * 把节点插入到可编辑区域的光标位置（无光标时插到末尾）
   * @param {HTMLElement} editor 可编辑容器
   * @param {Node} node 待插入节点
   */
  function insertAtCaret(editor, node) {
    var selection = window.getSelection();
    var range = selection && selection.rangeCount ? selection.getRangeAt(0) : null;
    if (!range || !editor.contains(range.commonAncestorContainer)) {
      // 当前选区不在输入框内时，优先用之前记录的光标位置
      range = (savedRange && editor.contains(savedRange.commonAncestorContainer)) ? savedRange : null;
    }
    if (!range) {
      editor.appendChild(node);
      return;
    }
    range.deleteContents();
    range.insertNode(node);
    // 光标移到表情后面，便于继续输入
    range.setStartAfter(node);
    range.collapse(true);
    if (selection) {
      selection.removeAllRanges();
      selection.addRange(range);
    }
    savedRange = range.cloneRange();
  }

  /** 设置引用回复目标 */
  function setQuote(msg) {
    state.quote = {
      id: msg.id,
      name: msg.senderNick || msg.senderName || '',
      text: String(msg.text || '').slice(0, 60)
    };
    var bar = document.getElementById('quoteBar');
    var text = document.getElementById('quoteText');
    if (!bar || !text) return;
    text.textContent = '引用 ' + state.quote.name + '：' + state.quote.text;
    bar.classList.add('show');
  }

  /** 清除引用状态 */
  function clearQuote() {
    state.quote = null;
    var bar = document.getElementById('quoteBar');
    if (bar) bar.classList.remove('show');
  }

  /** 发送输入框内容（文字与表情按输入顺序混排，纯文字支持引用回复） */
  function sendEditor() {
    var editor = document.getElementById('msgInput');
    if (!editor) return;
    var parts = serializeEditor(editor);                 // 按顺序解析出的片段
    if (!parts.length) return;

    var hasEmoji = parts.some(function (p) { return p.type === 'emoji'; });
    editor.innerHTML = '';                               // 先清空，失败再恢复
    var request;
    if (hasEmoji) {
      // 含表情走图文接口（接口会校验表情编码合法性）
      request = api('/conversations/' + enc(state.convId) + '/images', {
        method: 'POST', body: { parts: parts }
      });
    } else {
      var payload = { text: parts[0].text };
      if (state.quote) payload.quoteId = state.quote.id;  // 引用回复
      request = api('/conversations/' + enc(state.convId) + '/messages', {
        method: 'POST', body: payload
      });
    }

    request.then(function () {
      clearQuote();
      loadMessages(true);
    }).catch(function (e) {
      renderEditor(editor, parts);                       // 失败恢复输入内容，方便重发
      toast(e.message);
    });
  }

  /**
   * 解析可编辑区域为消息片段（文字 / 表情，按出现顺序）
   * @param {HTMLElement} editor 可编辑容器
   * @returns {Array<object>} 片段数组
   */
  function serializeEditor(editor) {
    var parts = [];                                      // 解析结果
    var text = '';                                       // 当前累积的文字

    /** 把累积文字压入结果（去掉首尾空白） */
    function flushText() {
      if (text.trim()) parts.push({ type: 'text', text: text.trim() });
      text = '';
    }

    (function walk(node) {
      for (var i = 0; i < node.childNodes.length; i++) {
        var child = node.childNodes[i];
        if (child.nodeType === 3) {
          text += child.nodeValue;
          continue;
        }
        if (child.nodeName === 'IMG') {
          var code = child.getAttribute('data-emoji');
          if (code) {
            flushText();
            parts.push({ type: 'emoji', code: code });
          }
          continue;
        }
        if (child.nodeName === 'BR') {
          text += '\n';
          continue;
        }
        // DIV / P 等块级节点视为换行，继续深入解析其内容
        if (child.childNodes.length) {
          if (text && node.childNodes.length > 1) text += '\n';
          walk(child);
          if (i < node.childNodes.length - 1) text += '\n';
        }
      }
    })(editor);

    flushText();
    return parts;
  }

  /**
   * 把片段还原到输入框（发送失败时使用）
   * @param {HTMLElement} editor 可编辑容器
   * @param {Array<object>} parts 片段数组
   */
  function renderEditor(editor, parts) {
    editor.innerHTML = '';
    parts.forEach(function (part) {
      if (part.type === 'text') {
        editor.appendChild(document.createTextNode(part.text));
      } else if (part.type === 'emoji') {
        var img = document.createElement('img');
        img.className = 'input-emoji';
        img.setAttribute('data-emoji', part.code);
        img.setAttribute('src', '/im/emoji/' + part.code + '.png');
        img.setAttribute('alt', '[表情]');
        editor.appendChild(img);
      }
    });
  }

  /** 压缩图片后发送 */
  function sendImage(file) {
    compressImage(file).then(function (dataUrl) {
      return api('/conversations/' + enc(state.convId) + '/images', {
        method: 'POST', body: { parts: [{ type: 'image', dataUrl: dataUrl }] }
      });
    }).then(function () {
      loadMessages(true);
    }).catch(function (e) {
      toast(e.message || '图片发送失败');
    });
  }

  /** 读取文件并发送（≤20MB） */
  function sendFile(file) {
    if (file.size > 20 * 1024 * 1024) {
      toast('文件不能超过 20MB');
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      api('/conversations/' + enc(state.convId) + '/files', {
        method: 'POST', body: { name: file.name, dataUrl: reader.result }
      }).then(function () {
        loadMessages(true);
      }).catch(function (e) {
        toast(e.message || '文件发送失败');
      });
    };
    reader.onerror = function () { toast('文件读取失败'); };
    reader.readAsDataURL(file);
  }

  /** 压缩图片：最长边 1000，JPEG 82 */
  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          var max = 1000;
          var scale = Math.min(1, max / Math.max(img.width, img.height));
          var canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  /** 拉取消息；force=false 时内容无变化不重绘 */
  function loadMessages(force) {
    if (!state.convId) return;
    var convId = state.convId;
    api('/conversations/' + enc(convId) + '/messages').then(function (list) {
      if (state.view !== 'chat' || state.convId !== convId) return;
      list = list || [];
      var sig = list.length + '|' + ((list[list.length - 1] || {}).id || '')
        + '|' + list.filter(function (m) { return m.recalled; }).length;
      if (!force && sig === state.lastSig) return;
      state.msgs = list;
      state.lastSig = sig;
      renderMessages();
      markRead(convId);
    }).catch(function () { /* 轮询失败静默重试 */ });
  }

  /**
   * 当前用户能否撤回他人消息：群主 / 平台管理员 / 班主任 / 老师 / 家委
   * @returns {boolean} 权限判定结果
   */
  function canRecallOthers() {
    var conv = null;                               // 当前会话对象（来自列表缓存）
    for (var i = 0; i < state.convs.length; i++) {
      if (state.convs[i].id === state.convId) { conv = state.convs[i]; break; }
    }
    if (!conv || conv.type !== 'group') return false;
    if (state.me.isAdmin || conv.ownerId === MY_ID) return true;
    var role = conv.prefs && conv.prefs.identity && conv.prefs.identity.role;   // 本群身份
    return ['班主任', '老师', '家委'].indexOf(role) >= 0;
  }

  /**
   * 撤回提示文案
   * 本人撤回：XX 撤回了一条消息
   * 管理身份撤回成员消息：你/管理员/某人 撤回了成员「昵称」的一条消息
   * @param {object} msg 消息对象
   * @returns {string} 提示 HTML
   */
  function sysRecallHtml(msg) {
    if (msg.memberRecall) {
      var who = msg.recalledBy === MY_ID
        ? '你'
        : (msg.recalledByName || '管理员');          // 操作者称呼（管理员或姓名）
      var target = msg.senderNick || msg.senderName || '';   // 被撤回消息的发送者
      return '<div class="sys-tip">' + esc(who) + '撤回了'
        + (target ? '成员「' + esc(target) + '」的一条消息' : '一条成员消息')
        + '</div>';
    }
    return '<div class="sys-tip">' + esc(msg.senderNick || msg.senderName || '') + ' 撤回了一条消息</div>';
  }

  /** 标记已读 */
  function markRead(convId) {
    api('/conversations/' + enc(convId) + '/read', { method: 'POST' }).catch(function () { });
  }

  /** 渲染消息列表 */
  function renderMessages() {
    var box = document.getElementById('msgBox');
    if (!box) return;
    var stick = isNearBottom(box);
    var html = '';
    var lastTime = 0;

    state.msgs.forEach(function (msg) {
      var t = parseTime(msg.time);
      if (t && (!lastTime || t - lastTime > 5 * 60 * 1000)) {
        html += '<div class="time-tip">' + esc(fmtChatTime(t)) + '</div>';
      }
      if (t) lastTime = t;

      if (msg.recalled) {
        html += sysRecallHtml(msg);
        return;
      }
      html += msgRow(msg);
    });

    box.innerHTML = html || '<div class="empty">暂无消息</div>';
    hydrateImages(box);
    if (stick) box.scrollTop = box.scrollHeight;
  }

  /** 身份标配色：与网页版一致，仅班主任 / 老师 / 家委展示身份标 */
  var ROLE_TONES = {
    '班主任': 'role-head',
    '老师': 'role-teacher',
    '家委': 'role-committee'
  };

  /**
   * 生成身份标 HTML（群昵称左侧的小徽标）
   * @param {string} role 群内身份
   * @returns {string} 非班主任/老师/家委时返回空串
   */
  function roleBadgeHtml(role) {
    var tone = ROLE_TONES[role];
    if (!tone) return '';
    return '<span class="role ' + tone + '">' + esc(role) + '</span>';
  }

  /** 单条消息 HTML */
  function msgRow(msg) {
    var mine = msg.senderId === MY_ID;
    var parts = msg.parts || [];
    var body = '';
    var hasText = false;                                        // 是否含文字片段
    var hasMedia = false;                                       // 是否含图片 / 文件片段
    var emojiCount = 0;                                         // 表情片段数量

    // 引用块
    if (msg.quote) {
      body += '<div class="quote">' + esc(msg.quote.name || '') + '：' + esc(msg.quote.text || '') + '</div>';
    }

    if (parts.length) {
      parts.forEach(function (part) {
        if (part.type === 'text') {
          hasText = true;
          // 用行内元素承载文字，后续表情可以紧接文字排布
          body += '<span>' + esc(part.text) + '</span>';
        } else if (part.type === 'image') {
          hasMedia = true;
          body += '<img data-auth="' + esc(part.src) + '" data-view="' + esc(part.src) + '" alt="">';
        } else if (part.type === 'emoji') {
          emojiCount++;
          body += '<img class="emoji" src="/im/emoji/' + esc(part.code) + '.png" alt="[表情]">';
        } else if (part.type === 'file') {
          hasMedia = true;
          body += '<div class="file-card" data-download="' + esc(part.url) + '" data-name="' + esc(part.name) + '">'
            + '<div class="info"><div class="fname">' + esc(part.name) + '</div>'
            + '<div class="fsize">' + esc(fmtSize(part.size)) + '</div></div>'
            + '<div class="file-icon">' + fileIconSvg(part.name) + '</div></div>';
        } else if (part.type === 'homework') {
          // 聊天里的作业卡片：点击进入作业详情
          hasMedia = true;
          body += '<div class="hw-card" data-hw="' + esc(part.homeworkId) + '">'
            + '<div class="hw-main"><div class="hw-title">' + esc(part.title || '班级作业') + '</div>'
            + '<div class="hw-icon" style="background:' + subjectColor(part.subject) + '">'
            + esc(subjectChar(part.subject)) + '</div></div>'
            + '<div class="hw-foot">' + ICONS.homework + '<span>班级作业</span></div></div>';
        }
      });
    } else {
      if (msg.image) {
        hasMedia = true;
        body += '<img data-auth="' + esc(msg.image) + '" data-view="' + esc(msg.image) + '" alt="">';
      } else {
        hasText = true;
        body += '<div>' + esc(msg.text || '') + '</div>';
      }
    }

    // 纯媒体消息不套气泡框；只有一个表情时按大表情展示
    var bubbleClass = 'bubble';
    if (!hasText && emojiCount === 0) bubbleClass += ' media';
    if (!hasText && !hasMedia && emojiCount === 1) bubbleClass += ' super';

    var avatar = avatarHtml('/api/user-avatar/' + enc(msg.senderId), msg.senderName);
    var nick = '';                                              // 发送者名称区（身份标 + 群昵称）
    // 群聊展示「身份标 + 群昵称」；自己发的消息仅设置过身份标时才展示（与网页版一致）
    if (state.isGroup && (!mine || msg.senderRole)) {
      var nickText = msg.senderNick || msg.senderName || '';
      if (nickText) {
        nick = '<div class="nick">' + roleBadgeHtml(msg.senderRole) + esc(nickText) + '</div>';
      }
    }

    return '<div class="msg ' + (mine ? 'mine' : '') + '" data-id="' + esc(msg.id) + '">'
      + '<div class="avatar-box">' + avatar + '</div>'
      + '<div class="msg-col">' + nick
      + '<div class="' + bubbleClass + '">' + body + '</div></div></div>';
  }

  /* ==================== 消息长按菜单 ==================== */

  /** 菜单最近一次打开时间（用于忽略打开瞬间的误触关闭） */
  var ctxOpenedAt = 0;
  /** 长按菜单打开后短暂屏蔽 click 事件的时间点 */
  var suppressClickUntil = 0;

  /**
   * 取消息中指定类型的第一个片段
   * @param {object} msg 消息对象
   * @param {string} type 片段类型 text / image / file / emoji
   * @returns {object|null} 片段或 null
   */
  function firstPart(msg, type) {
    var parts = msg.parts || [];
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].type === type) return parts[i];
    }
    return null;
  }

  /**
   * 取消息的可复制文字
   * @param {object} msg 消息对象
   * @returns {string} 文字内容
   */
  function textOf(msg) {
    var part = firstPart(msg, 'text');
    if (part) return part.text || '';
    if (msg.parts && msg.parts.length) return '';
    return msg.text || '';
  }

  /**
   * 按 ID 查找当前会话中的消息
   * @param {string} id 消息 ID
   * @returns {object|null}
   */
  function findMsg(id) {
    for (var i = 0; i < state.msgs.length; i++) {
      if (state.msgs[i].id === id) return state.msgs[i];
    }
    return null;
  }

  /** 绑定消息长按（450ms）弹出操作菜单 */
  function bindLongPress() {
    var box = document.getElementById('msgBox');
    if (!box) return;
    var timer = null;                 // 长按计时器
    var startX = 0;                   // 按下时的 X
    var startY = 0;                   // 按下时的 Y

    /** 取消长按计时 */
    function cancel() {
      if (timer) { clearTimeout(timer); timer = null; }
    }

    box.addEventListener('touchstart', function (ev) {
      if (ev.touches.length !== 1) { cancel(); return; }
      var row = ev.target.closest('.msg');
      if (!row) return;
      startX = ev.touches[0].clientX;
      startY = ev.touches[0].clientY;
      timer = setTimeout(function () {
        timer = null;
        var msg = findMsg(row.getAttribute('data-id'));
        if (msg) openCtx(msg, startX, startY);
      }, 450);
    }, { passive: true });

    box.addEventListener('touchmove', function (ev) {
      if (!timer) return;
      var t = ev.touches[0];
      // 手指滑动超过 8px 视为滚动，取消长按
      if (Math.abs(t.clientX - startX) > 8 || Math.abs(t.clientY - startY) > 8) cancel();
    }, { passive: true });

    box.addEventListener('touchend', cancel);
    box.addEventListener('touchcancel', cancel);
    box.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
  }

  /**
   * 打开消息操作菜单
   * @param {object} msg 目标消息
   * @param {number} x 长按位置 X
   * @param {number} y 长按位置 Y
   */
  function openCtx(msg, x, y) {
    var menu = document.getElementById('ctxMenu');
    var mask = document.getElementById('ctxMask');
    if (!menu || !mask) return;

    var text = textOf(msg);                         // 可复制 / 引用的文字
    var image = firstPart(msg, 'image');            // 图片片段
    var file = firstPart(msg, 'file');              // 文件片段

    var items = [];
    if (text) items.push({ op: 'copy', label: '复制' });
    if (text) items.push({ op: 'quote', label: '引用回复' });
    if (image) items.push({ op: 'saveImage', label: '保存图片' });
    if (file) items.push({ op: 'saveFile', label: '下载文件' });
    if (items.length) items.push({ op: 'sep' });
    items.push({ op: 'delete', label: '删除', danger: true });
    // 自己的消息可撤回；班主任/老师/家委/群主/管理员还可撤回他人消息
    if (msg.senderId === MY_ID || canRecallOthers()) {
      items.push({ op: 'recall', label: '撤回', danger: true });
    }

    menu.innerHTML = items.map(function (it) {
      if (it.op === 'sep') return '<div class="ctx-divider"></div>';
      return '<div class="ctx-item' + (it.danger ? ' danger' : '') + '" data-op="' + it.op + '">'
        + it.label + '</div>';
    }).join('');

    mask.classList.add('show');
    menu.style.visibility = 'hidden';                // 先渲染再测量，避免定位跳动
    menu.style.left = '0px';
    menu.style.top = '0px';
    var mw = menu.offsetWidth;                       // 菜单宽度
    var mh = menu.offsetHeight;                      // 菜单高度
    var left = Math.max(8, Math.min(x, window.innerWidth - mw - 8));
    var top = Math.max(8, Math.min(y, window.innerHeight - mh - 8));
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
    menu.style.visibility = 'visible';

    menu.onclick = function (ev) {
      var item = ev.target.closest('.ctx-item');
      if (!item) return;
      handleCtx(item.getAttribute('data-op'), msg);
      hideCtx();
    };
    ctxOpenedAt = Date.now();
    suppressClickUntil = ctxOpenedAt + 500;   // 屏蔽长按抬起产生的 click
  }

  /** 关闭消息操作菜单 */
  function hideCtx() {
    var mask = document.getElementById('ctxMask');
    if (mask) mask.classList.remove('show');
  }

  /**
   * 处理长按菜单操作
   * @param {string} op 操作类型
   * @param {object} msg 目标消息
   */
  function handleCtx(op, msg) {
    if (op === 'copy') {
      copyText(textOf(msg));
      return;
    }
    if (op === 'quote') {
      setQuote(msg);
      var input = document.getElementById('msgInput');
      if (input) input.focus();
      return;
    }
    if (op === 'saveImage') {
      var image = firstPart(msg, 'image');
      if (image) downloadFile(image.src, (image.src.split('/').pop() || 'image.jpg'));
      return;
    }
    if (op === 'saveFile') {
      var file = firstPart(msg, 'file');
      if (file) downloadFile(file.url, file.name || '文件');
      return;
    }
    if (op === 'delete') {
      api('/messages/' + enc(msg.id), { method: 'DELETE' }).then(function () {
        state.msgs = state.msgs.filter(function (m) { return m.id !== msg.id; });
        state.lastSig = '';                          // 强制下次轮询重绘
        renderMessages();
        toast('已本地删除');
      }).catch(function (e) { toast(e.message); });
      return;
    }
    if (op === 'recall') {
      api('/messages/' + enc(msg.id) + '/recall', { method: 'POST' }).then(function (r) {
        toast(r && r.memberRecall ? '已撤回成员消息' : '已撤回一条消息');
        // 重新拉取消息，带上撤回操作者信息，保证提示文案准确
        loadMessages(true);
      }).catch(function (e) { toast(e.message); });
    }
  }

  /**
   * 复制文字到剪贴板（优先 Clipboard API，失败后降级到 execCommand）
   * @param {string} text 要复制的文字
   */
  function copyText(text) {
    if (!text) {
      toast('没有可复制的文字');
      return;
    }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        toast('已复制');
      } catch (e) {
        toast('复制失败');
      }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('已复制'); }).catch(fallback);
    } else {
      fallback();
    }
  }

  // 点击空白遮罩关闭菜单（打开瞬间的抬起视为误触，不关闭）
  (function bindCtxMask() {
    var mask = document.getElementById('ctxMask');
    if (!mask) return;
    mask.addEventListener('click', function (ev) {
      if (ev.target !== mask) return;
      if (Date.now() - ctxOpenedAt < 300) return;
      hideCtx();
    });
  })();

  /** 开始聊天轮询（10 秒兜底：正常情况下 WebSocket 会实时刷新） */
  function startChatPoll() {
    stopChatPoll();
    chatTimer = setInterval(function () {
      if (state.view === 'chat') loadMessages(false);
    }, 10000);
  }

  /** 停止聊天轮询 */
  function stopChatPoll() {
    if (chatTimer) { clearInterval(chatTimer); chatTimer = null; }
  }

  /* ==================== 聊天信息页 ==================== */
  /** 打开聊天信息页 */
  function openSettings() {
    state.view = 'settings';
    stopChatPoll();
    setHeader('聊天信息', true, false);
    main.innerHTML = '<div class="page"><div class="loading">加载中…</div></div>';

    api('/conversations/' + enc(state.convId)).then(function (detail) {
      if (state.view !== 'settings') return;
      state.detail = detail;
      renderSettings(detail);
    }).catch(function (e) {
      toast(e.message);
      openChat(state.convId, state.convTitle, state.isGroup);
    });
  }

  /** 渲染聊天信息页 */
  function renderSettings(detail) {
    var members = detail.members || [];
    var isGroup = detail.type === 'group';        // 仅群聊展示群成员、群资料与邀请入口
    var html = '<div class="page">';

    // 群成员卡片（单聊只展示对方资料）
    html += '<div class="card"><div class="section-title">' + (isGroup ? '群成员' : '聊天成员') + '</div><div class="member-grid">';
    members.forEach(function (m) {
      html += '<div class="member-cell">'
        + '<div class="avatar-box">' + avatarHtml(m.avatar, m.name) + '</div>'
        + '<div class="mname">' + esc(m.name) + '</div></div>';
    });
    if (isGroup) {
      html += '<div class="member-cell invite-cell" id="inviteEntry">'
        + '<div class="invite-icon">' + ICONS.plus + '</div><div class="mname">邀请</div></div>';
    }
    html += '</div></div>';

    // 群资料（仅群聊）
    if (detail.type === 'group') {
      html += '<div class="card">'
        + '<div class="row" data-edit="title"><span class="label">群名称</span>'
        + '<span class="value">' + esc(detail.title || '未设置') + '</span><span class="arrow">' + ICONS.arrow + '</span></div>'
        + '<div class="divider"></div>'
        + '<div class="row" data-edit="announcement"><span class="label">群公告</span>'
        + '<span class="value">' + esc(detail.announcement || '未设置') + '</span><span class="arrow">' + ICONS.arrow + '</span></div>'
        + '</div>';
    }

    // 偏好
    var prefs = detail.prefs || {};
    html += '<div class="card">'
      + '<div class="row"><span class="label">置顶聊天</span>'
      + '<span class="value"></span><label class="switch"><input type="checkbox" id="prefPinned"'
      + (prefs.pinned ? ' checked' : '') + '><i></i></label></div>'
      + '<div class="divider"></div>'
      + '<div class="row"><span class="label">消息免打扰</span>'
      + '<span class="value"></span><label class="switch"><input type="checkbox" id="prefMuted"'
      + (prefs.muted ? ' checked' : '') + '><i></i></label></div>'
      + '</div>';

    // 群主 / 平台管理员：解散群聊（危险操作，置于最下方）
    var canDissolve = isGroup && (state.me.isAdmin || detail.ownerId === MY_ID);
    if (canDissolve) {
      html += '<div class="card"><div class="row danger-row" id="dissolveGroup">'
        + '<span class="label">解散群聊</span></div></div>';
    }

    html += '</div>';
    main.innerHTML = html;
    hydrateImages(main);

    var inviteEntry = document.getElementById('inviteEntry');
    if (inviteEntry) inviteEntry.addEventListener('click', openInvite);
    document.getElementById('prefPinned').addEventListener('change', function () {
      updatePref('pinned', this.checked);
    });
    document.getElementById('prefMuted').addEventListener('change', function () {
      updatePref('muted', this.checked);
    });

    var editRows = main.querySelectorAll('[data-edit]');
    for (var i = 0; i < editRows.length; i++) {
      (function (row) {
        row.addEventListener('click', function () {
          var key = row.getAttribute('data-edit');
          var current = key === 'title' ? detail.title : detail.announcement;
          editGroupField(key, current || '');
        });
      })(editRows[i]);
    }

    // 解散群聊（仅群主 / 平台管理员可见）：二次确认后删除整个会话
    var dissolveBtn = document.getElementById('dissolveGroup');
    if (dissolveBtn) {
      dissolveBtn.addEventListener('click', function () {
        confirmDlg('解散后该群及聊天记录、作业将一并移除，无法恢复。确定解散「'
          + (detail.title || '该群聊') + '」吗？', function () {
          api('/conversations/' + enc(state.convId), { method: 'DELETE' }).then(function () {
            toast('已解散该群聊');
            // 本地移除该会话，避免返回列表后仍显示
            state.convs = state.convs.filter(function (c) { return c.id !== state.convId; });
            state.detail = null;
            renderList();
          }).catch(function (e) {
            toast(e.message);
          });
        });
      });
    }
  }

  /** 更新置顶 / 免打扰 */
  function updatePref(key, value) {
    var body = {};
    body[key] = value;
    api('/conversations/' + enc(state.convId) + '/prefs', {
      method: 'PATCH', body: body
    }).then(function () {
      toast('已保存');
    }).catch(function (e) {
      toast(e.message);
    });
  }

  /** 修改群名称 / 群公告 */
  function editGroupField(key, current) {
    var title = key === 'title' ? '修改群名称' : '修改群公告';
    var value = window.prompt(title, current);
    if (value === null) return;
    value = value.trim();
    if (value === current) return;
    var body = {};
    body[key] = value;
    api('/conversations/' + enc(state.convId), {
      method: 'PATCH', body: body
    }).then(function () {
      toast('已保存');
      openSettings();
    }).catch(function (e) {
      toast(e.message);
    });
  }

  /* ==================== 邀请成员页 ==================== */
  /** 打开邀请成员页 */
  function openInvite() {
    state.view = 'invite';
    state.inviteUsers = [];
    state.inviteSelected = {};
    setHeader('选择联系人', true, false);

    main.innerHTML =
      '<div class="invite-search"><input id="inviteSearch" placeholder="输入姓名或账号搜索"></div>'
      + '<div class="invite-list" id="inviteList"><div class="empty">输入关键词查找要邀请的人</div></div>'
      + '<button class="invite-submit" id="inviteSubmit">立即邀请</button>';

    var search = document.getElementById('inviteSearch');
    search.addEventListener('input', function () {
      clearTimeout(inviteTimer);
      var q = search.value.trim();
      inviteTimer = setTimeout(function () { searchUsers(q); }, 300);
    });

    document.getElementById('inviteSubmit').addEventListener('click', submitInvite);
  }

  /** 搜索用户 */
  function searchUsers(q) {
    if (!q) {
      document.getElementById('inviteList').innerHTML =
        '<div class="empty">输入关键词查找要邀请的人</div>';
      return;
    }
    api('/users?q=' + enc(q)).then(function (users) {
      state.inviteUsers = users || [];
      renderInviteUsers();
    }).catch(function (e) {
      toast(e.message);
    });
  }

  /** 渲染邀请结果 */
  function renderInviteUsers() {
    var box = document.getElementById('inviteList');
    if (!box) return;
    if (!state.inviteUsers.length) {
      box.innerHTML = '<div class="empty">没有找到用户</div>';
      return;
    }
    var html = '';
    state.inviteUsers.forEach(function (user) {
      var on = state.inviteSelected[user.id];
      html += '<div class="invite-row" data-user="' + esc(user.id) + '">'
        + '<div class="avatar-box">' + avatarHtml(user.avatar, user.name) + '</div>'
        + '<div class="iname">' + esc(user.name) + '</div>'
        + '<div class="check ' + (on ? 'on' : '') + '">' + (on ? ICONS.check : '') + '</div>'
        + '</div>';
    });
    box.innerHTML = html;
    hydrateImages(box);

    var rows = box.querySelectorAll('[data-user]');
    for (var i = 0; i < rows.length; i++) {
      (function (row) {
        row.addEventListener('click', function () {
          var id = row.getAttribute('data-user');
          if (state.inviteSelected[id]) delete state.inviteSelected[id];
          else state.inviteSelected[id] = true;
          renderInviteUsers();
        });
      })(rows[i]);
    }
  }

  /** 提交邀请 */
  function submitInvite() {
    var ids = Object.keys(state.inviteSelected);
    if (!ids.length) {
      toast('请先选择联系人');
      return;
    }
    api('/conversations/' + enc(state.convId) + '/members', {
      method: 'POST', body: { memberIds: ids }
    }).then(function () {
      toast('邀请成功');
      openSettings();
    }).catch(function (e) {
      toast(e.message);
    });
  }

  /* ==================== 全局交互 ==================== */
  /** 顶栏返回 */
  backBtn.addEventListener('click', function () {
    window.imHandleBack();
  });
