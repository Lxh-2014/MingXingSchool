  /** 顶栏菜单：进入聊天信息 */
  menuBtn.addEventListener('click', function () {
    if (headerAction) { headerAction(); return; }
    if (state.view === 'chat') openSettings();
  });

  /**
   * 内容区事件委托：会话切换、图片预览、文件下载、作业卡片
   * 宽屏双栏下左栏位于 #side，与右栏 #main 共用同一套处理逻辑
   * @param {MouseEvent} ev 点击事件
   */
  function handlePaneClick(ev) {
    // 长按菜单刚弹出时，手指抬起会产生一次 click，这里忽略避免误触图片预览
    if (Date.now() < suppressClickUntil) return;

    var conv = ev.target.closest('[data-conv]');
    // 宽屏下左栏常驻，聊天中点击左侧其他会话也能直接切换
    if (conv) {
      openChat(conv.getAttribute('data-conv'), conv.getAttribute('data-title') || conv.getAttribute('data-name'),
        conv.getAttribute('data-group') === '1');
      return;
    }

    var img = ev.target.closest('img[data-view]');
    if (img && img.src) {
      openViewer(img.src, img.getAttribute('data-view'));
      return;
    }

    var file = ev.target.closest('[data-download]');
    if (file) {
      var url = file.getAttribute('data-download');
      var name = file.getAttribute('data-name') || '文件';
      downloadFile(url, name);
      return;
    }

    // 作业列表卡片 → 详情；聊天里的作业卡片 → 先进列表再进详情（返回可逐级退出）
    var workCard = ev.target.closest('[data-work]');
    if (workCard) {
      openWorkDetail(workCard.getAttribute('data-work'));
      return;
    }
    var hwCard = ev.target.closest('[data-hw]');
    if (hwCard) {
      openHomeworkFromChat(hwCard.getAttribute('data-hw'));
    }
  }

  main.addEventListener('click', handlePaneClick);
  // 宽屏左栏（平板双栏布局）同样绑定点击委托，否则左栏只能看不能点
  var sidePane = document.getElementById('side');
  if (sidePane) sidePane.addEventListener('click', handlePaneClick);

  /** 打开图片全屏预览
   *  @param {string} src 已鉴权的 blob 地址（直接用于展示）
   *  @param {string} path 图片接口路径（保存原图时使用）
   */
  function openViewer(src, path) {
    state.viewerSrc = src;
    state.viewerPath = path || '';
    viewerImg.src = src;
    viewer.style.display = 'flex';
  }

  /** 关闭图片预览 */
  function closeViewer() {
    viewer.style.display = 'none';
    viewerImg.src = '';
    state.viewerSrc = '';
    state.viewerPath = '';
  }

  viewer.addEventListener('click', closeViewer);

  /** 保存当前预览的原图：交给原生下载，保留原始文件名 */
  viewerSave.addEventListener('click', function (ev) {
    ev.stopPropagation();          // 阻止冒泡，避免同时触发关闭预览
    var path = state.viewerPath;
    if (!path) {
      toast('图片地址无效');
      return;
    }
    var name = path.split('/').pop() || 'image.jpg';
    downloadFile(path, name);
  });

  /** 下载文件：优先交给原生 DownloadManager，浏览器调试时直接打开 */
  function downloadFile(url, name) {
    if (bridge && bridge.download) {
      bridge.download(url, name);
    } else {
      window.open(BASE + url, '_blank');
    }
  }

  /** 原生返回键：返回 true 表示已处理，false 交给原生关闭页面 */
  window.imHandleBack = function () {
    var ctxMask = document.getElementById('ctxMask');
    if (ctxMask && ctxMask.classList.contains('show')) { hideCtx(); return true; }
    if (state.viewerSrc) { closeViewer(); return true; }
    if (document.getElementById('imDlg')) { closeDlg(); return true; }
    if (state.view === 'workDetail') { openWork(); return true; }
    if (state.view === 'workEdit') { openWork(); return true; }
    if (state.view === 'work') { openChat(state.convId, state.convTitle, state.isGroup); return true; }
    if (state.view === 'invite') { openSettings(); return true; }
    if (state.view === 'settings') { openChat(state.convId, state.convTitle, state.isGroup); return true; }
    if (state.view === 'friends') {
      // 从首页「+」进入新朋友时返回首页，从联系人页进入时返回联系人页
      if (state.friendsFrom === 'list') renderList(); else openContacts();
      return true;
    }
    if (state.view === 'contacts') { renderList(); return true; }
    if (state.view === 'chat') {
      // 宽屏双栏：右栏回到欢迎态，左栏会话列表保持不动
      if (isWide()) {
        state.view = 'list';
        state.convId = '';
        setHeader('邻语', false, false);
        setHeaderIcon(ICONS.plus, openAddMenu);
        main.innerHTML = '<div class="wide-empty">选择一个会话开始聊天</div>';
        if (bridge && bridge.setCurrentConv) bridge.setCurrentConv('');
        return true;
      }
      // 手机单列：从联系人页进入的聊天，返回时回到联系人页
      if (state.chatFrom === 'contacts') openContacts(); else renderList();
      return true;
    }
    return false;
  };

  /** 供原生调用：从通知直接打开指定会话 */
  window.imOpenConv = function (id, title, isGroup) {
    if (!id) return;
    openChat(id, title || '邻语', !!isGroup);
  };

  /** 页面不可见时暂停轮询，回到前台再恢复 */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      stopListPoll();
      stopChatPoll();
    } else {
      if (!wsConn) connectWs();                 // 后台期间长连接可能被系统断开
      if (state.view === 'list') {
        startListPoll();
      } else if (state.view === 'chat') {
        startChatPoll();
      }
    }
  });

  /* ==================== 安卓 WebView 视口适配 ==================== */
  /** 上一次可视区高度，用于判断是否是软键盘弹出引起的尺寸变化 */
  var lastViewportHeight = window.innerHeight;
  var lastWide = window.innerWidth >= 768;              // 上一次是否处于宽屏双栏布局

  /**
   * 安卓软键盘弹出时 WebView 高度会变小并触发 resize，
   * 聊天页需要重新滚到底部，否则最后几条消息会被输入框挡住；
   * 同时处理旋转 / 分屏导致的手机-平板断点切换
   */
  window.addEventListener('resize', function () {
    var wide = window.innerWidth >= 768;
    if (wide !== lastWide) {
      lastWide = wide;
      if (wide) {
        // 进入宽屏：补出左栏；正在聊天时保留右栏内容
        if (state.view === 'chat') {
          renderSidebar();
          loadConvs();
          setHeader(state.convTitle, false, true);
        } else {
          renderList();
        }
      } else if (state.view === 'list') {
        renderList();                                   // 回到窄屏单列，列表改渲染到主区
      }
    }

    var height = window.innerHeight;
    var keyboardUp = height < lastViewportHeight;      // 高度变小通常代表软键盘弹出
    lastViewportHeight = height;
    if (!keyboardUp || state.view !== 'chat') return;
    var box = document.getElementById('msgBox');
    if (box) box.scrollTop = box.scrollHeight;
  });

  /* ==================== 首页「+」与联系人 ==================== */
  /** 首页右上角「+」菜单：发起群聊 / 加好友 / 新朋友 */
  function openAddMenu() {
    var pending = (state.contacts && state.contacts.pendingCount) || 0;
    openDlg('<h3>发起</h3>'
      + '<div class="dlg-item" data-add="group"><span>发起群聊</span><span class="dlg-arrow">' + ICONS.arrow + '</span></div>'
      + '<div class="dlg-item" data-add="friend"><span>添加好友</span><span class="dlg-arrow">' + ICONS.arrow + '</span></div>'
      + '<div class="dlg-item" data-add="newfriend"><span>新朋友</span>'
      + (pending ? '<span class="badge-dot">' + pending + '</span>' : '<span class="dlg-arrow">' + ICONS.arrow + '</span>')
      + '</div>', function (root) {
      root.querySelectorAll('[data-add]').forEach(function (el) {
        el.addEventListener('click', function () {
          var action = el.getAttribute('data-add');
          closeDlg();
          if (action === 'group') openPickUsers('发起群聊', true, startGroupChat);
          else if (action === 'friend') openPickUsers('添加好友', false, sendFriendRequest);
          else openNewFriends();
        });
      });
    });
  }

  /** 打开联系人页（底部「联系人」标签） */
  function openContacts() {
    state.view = 'contacts';
    state.chatFrom = 'contacts';                   // 从联系人页进入聊天，返回时回到这里
    // 宽屏左栏常驻消息列表，右栏标题保持「邻语」，避免整屏标题变成"联系人"
    setHeader(isWide() ? '邻语' : '联系人', false, false);
    setHeaderIcon(ICONS.plus, openAddMenu);
    if (isWide()) markSideTab('contacts');         // 宽屏左栏同步高亮联系人标签
    main.innerHTML = '<div class="work-body" id="contactBody"><div class="work-empty">加载中…</div></div>';
    loadContacts();
  }

  /** 拉取联系人与群聊列表 */
  function loadContacts() {
    Promise.all([api('/contacts'), api('/conversations')]).then(function (res) {
      if (state.view !== 'contacts') return;
      state.contacts = res[0] || { friends: [], groups: [], pendingCount: 0 };
      var groups = (res[1] || []).filter(function (c) { return c.type === 'group'; });
      renderContacts(state.contacts, groups);
    }).catch(function (e) {
      var body = document.getElementById('contactBody');
      if (body) body.innerHTML = '<div class="work-empty">' + esc(e.message) + '</div>';
    });
  }

  /**
   * 渲染联系人页
   * @param {object} data 联系人数据 { friends, groups, pendingCount }
   * @param {Array} groups 群聊会话列表
   */
  function renderContacts(data, groups) {
    var body = document.getElementById('contactBody');
    if (!body) return;
    var html = '<div class="contact-sec">'
      + '<div class="contact-row" id="cNewFriends">'
      + '<span class="row-avatar" style="display:flex;align-items:center;justify-content:center;'
      + 'background:#34c759;border-radius:8px;color:#fff">' + ICONS.contacts + '</span>'
      + '<div class="name">新朋友'
      + (data.pendingCount ? '<span class="badge-dot" style="margin-left:6px">' + data.pendingCount + '</span>' : '')
      + '</div>' + ICONS.arrow + '</div></div>';

    if (groups.length) {
      html += '<div class="sec-title">群聊</div><div class="contact-sec">';
      groups.forEach(function (conv) {
        html += '<div class="contact-row" data-conv="' + esc(conv.id) + '" data-name="' + esc(conv.title)
          + '" data-group="1"><span class="row-avatar">' + avatarHtml(conv.avatar, conv.title) + '</span>'
          + '<div class="name">' + esc(conv.title) + '</div>' + ICONS.arrow + '</div>';
      });
      html += '</div>';
    }

    var friends = data.friends || [];
    html += '<div class="sec-title">好友（' + friends.length + '）</div><div class="contact-sec">';
    if (!friends.length) html += '<div class="work-empty">还没有好友，点右上角 + 添加</div>';
    friends.forEach(function (friend) {
      html += '<div class="contact-row" data-conv="' + esc(friend.convId) + '" data-name="' + esc(friend.displayName)
        + '"><span class="row-avatar">' + avatarHtml(friend.avatar, friend.displayName) + '</span>'
        + '<div class="name">' + (friend.online ? '<span class="online-dot"></span>' : '')
        + esc(friend.displayName)
        + (friend.remark ? '<div class="sub">' + esc(friend.name) + '</div>' : '') + '</div>'
        + ICONS.arrow + '</div>';
    });
    html += '</div>';
    body.innerHTML = html;
    hydrateImages(body);

    document.getElementById('cNewFriends').addEventListener('click', openNewFriends);
    body.querySelectorAll('[data-conv]').forEach(function (row) {
      row.addEventListener('click', function () {
        openChat(row.getAttribute('data-conv'), row.getAttribute('data-name'),
          row.getAttribute('data-group') === '1');
      });
    });
  }

  /** 打开「新朋友」页：收到的申请 / 我发出的申请 */
  function openNewFriends() {
    state.friendsFrom = state.view === 'list' ? 'list' : 'contacts';   // 记录来源，决定返回层级
    state.view = 'friends';
    setHeader('新朋友', true, false);
    // 宽屏左栏同步高亮：从首页进入保持「消息」，从联系人进入保持「联系人」
    if (isWide()) markSideTab(state.friendsFrom === 'list' ? 'msgs' : 'contacts');
    main.innerHTML = '<div class="work-body" id="frBody"><div class="work-empty">加载中…</div></div>';
    loadFriendRequests();
  }

  /** 拉取并渲染好友申请 */
  function loadFriendRequests() {
    api('/friend-requests').then(function (data) {
      if (state.view !== 'friends') return;
      var body = document.getElementById('frBody');
      if (!body) return;
      var incoming = (data.incoming || []).filter(function (r) { return r.status === 'pending'; });
      var outgoing = (data.outgoing || []).filter(function (r) { return r.status === 'pending'; });

      var html = '<div class="sec-title">收到的申请</div><div class="contact-sec">';
      if (!incoming.length) html += '<div class="work-empty">暂无新的申请</div>';
      incoming.forEach(function (req) {
        html += '<div class="contact-row"><span class="row-avatar">' + avatarHtml(req.avatar, req.name) + '</span>'
          + '<div class="name">' + esc(req.name) + '<div class="sub">'
          + esc(req.message || '请求加你为好友') + '</div></div>'
          + '<button class="fr-btn primary" data-accept="' + esc(req.id) + '">同意</button>'
          + '<button class="fr-btn" data-reject="' + esc(req.id) + '" style="margin-left:6px">拒绝</button></div>';
      });
      html += '</div>';

      if (outgoing.length) {
        html += '<div class="sec-title">我发出的申请</div><div class="contact-sec">';
        outgoing.forEach(function (req) {
          html += '<div class="contact-row"><span class="row-avatar">' + avatarHtml(req.avatar, req.name) + '</span>'
            + '<div class="name">' + esc(req.name) + '<div class="sub">等待对方验证</div></div></div>';
        });
        html += '</div>';
      }
      body.innerHTML = html;
      hydrateImages(body);

      body.querySelectorAll('[data-accept]').forEach(function (btn) {
        btn.addEventListener('click', function () { respondRequest('accept', btn.getAttribute('data-accept')); });
      });
      body.querySelectorAll('[data-reject]').forEach(function (btn) {
        btn.addEventListener('click', function () { respondRequest('reject', btn.getAttribute('data-reject')); });
      });
    }).catch(function (e) {
      var body = document.getElementById('frBody');
      if (body) body.innerHTML = '<div class="work-empty">' + esc(e.message) + '</div>';
    });
  }

  /**
   * 同意 / 拒绝好友申请
   * @param {string} action accept 或 reject
   * @param {string} id 申请 ID
   */
  function respondRequest(action, id) {
    api('/friend-requests/' + enc(id) + '/' + action, { method: 'POST' })
      .then(function () {
        toast(action === 'accept' ? '已同意' : '已拒绝');
        loadFriendRequests();
      }).catch(function (e) { toast(e.message); });
  }

  /**
   * 搜索并选择用户
   * @param {string} title 弹窗标题
   * @param {boolean} multi 是否多选
   * @param {Function} onDone 选中回调，入参为 [{id,name}]
   */
  function openPickUsers(title, multi, onDone) {
    openDlg('<h3>' + esc(title) + '</h3>'
      + '<input type="text" id="puQ" placeholder="输入姓名或用户 ID 搜索"'
      + ' autocomplete="off" autocorrect="off" autocapitalize="off" enterkeyhint="search">'
      + '<div id="puList"><div class="work-empty">输入关键词搜索</div></div>'
      + '<div class="dlg-actions"><button class="cancel" data-close>取消</button>'
      + '<button class="ok" id="puOk">确定</button></div>', function (root) {
      var selected = {};                              // 已选用户：ID → {id,name}
      var timer = null;                               // 搜索防抖定时器

      root.querySelector('#puQ').addEventListener('input', function () {
        clearTimeout(timer);
        var keyword = this.value.trim();
        if (!keyword) return;
        timer = setTimeout(function () {
          api('/users?q=' + encodeURIComponent(keyword)).then(function (users) {
            var list = root.querySelector('#puList');
            if (!users.length) {
              list.innerHTML = '<div class="work-empty">没有找到相关用户</div>';
              return;
            }
            list.innerHTML = users.map(function (u) {
              return '<div class="pu-row" data-uid="' + esc(u.id) + '" data-name="' + esc(u.name) + '">'
                + '<span class="row-avatar">' + avatarHtml(u.avatar, u.name) + '</span>'
                + '<span class="pu-name">' + esc(u.name) + '<i>' + esc(u.id) + '</i></span>'
                + (multi ? '<span class="pu-check' + (selected[u.id] ? ' on' : '') + '">' + ICONS.check + '</span>' : '')
                + '</div>';
            }).join('');
            list.querySelectorAll('[data-uid]').forEach(function (row) {
              row.addEventListener('click', function () {
                var user = { id: row.getAttribute('data-uid'), name: row.getAttribute('data-name') };
                if (!multi) {
                  closeDlg();
                  onDone([user]);
                  return;
                }
                if (selected[user.id]) {
                  delete selected[user.id];
                } else {
                  selected[user.id] = user;
                }
                row.querySelector('.pu-check').classList.toggle('on', !!selected[user.id]);
              });
            });
          }).catch(function (e) { toast(e.message); });
        }, 300);
      });

      root.querySelector('#puOk').addEventListener('click', function () {
        var picked = Object.keys(selected).map(function (key) { return selected[key]; });
        if (!picked.length) return toast('请选择联系人');
        closeDlg();
        onDone(picked);
      });
    });
  }

  /**
   * 发起群聊：先选人，再填群名
   * @param {Array} users 选中的用户
   */
  function startGroupChat(users) {
    var defaultTitle = users.map(function (u) { return u.name; }).join('、').slice(0, 20);
    openDlg('<h3>群聊名称</h3>'
      + '<input type="text" id="gTitle" maxlength="30" value="' + esc(defaultTitle) + '">'
      + '<div class="dlg-actions"><button class="cancel" data-close>取消</button>'
      + '<button class="ok" id="gOk">创建</button></div>', function (root) {
      root.querySelector('#gOk').addEventListener('click', function () {
        var title = root.querySelector('#gTitle').value.trim();
        if (!title) return toast('请填写群聊名称');
        api('/conversations', {
          method: 'POST',
          body: { type: 'group', title: title, memberIds: users.map(function (u) { return u.id; }) }
        }).then(function (conv) {
          closeDlg();
          openChat(conv.id, conv.title || title, true);
        }).catch(function (e) { toast(e.message); });
      });
    });
  }

  /**
   * 发送好友申请
   * @param {Array} users 选中的用户（单个）
   */
  function sendFriendRequest(users) {
    api('/friend-requests', { method: 'POST', body: { toId: users[0].id } })
      .then(function () {
        toast('好友申请已发送');
      }).catch(function (e) { toast(e.message); });
  }

  /* ==================== 群作业 ==================== */
  /** 作业状态缓存：列表数据、科目、能否布置、当前 Tab */
  state.work = { list: [], subjects: [], canManage: false, tab: 'all' };
  /** 当前作业详情 */
  state.workDetail = null;

  /** 科目底色（与网页版保持一致） */
  var HW_COLORS = {
    '语文': '#F08A5D', '数学': '#4A90D9', '英语': '#7B68EE', '物理': '#5B8FF9',
    '化学': '#57B98F', '生物': '#48B884', '历史': '#C08A3E', '地理': '#3FA9A0',
    '政治': '#D9534F', '体育': '#F2994A', '音乐': '#9B59B6', '美术': '#E67E73',
    '信息技术': '#4FA3D1', '综合': '#8A8F99'
  };

  /** 科目默认底色 */
  function subjectColor(subject) {
    return HW_COLORS[subject] || '#8A8F99';
  }

  /** 科目图标文字：取科目首字（如 数学 → 数） */
  function subjectChar(subject) {
    return String(subject || '作').charAt(0);
  }

  /** 科目小方块 */
  function subjectBadge(subject) {
    return '<span class="wc-subject" style="background:' + subjectColor(subject) + '">'
      + esc(subjectChar(subject)) + '</span>';
  }

  /** 日期短标签：M月d日 */
  function shortDate(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  /** 日期分组标签：星期X M月d日（今天/昨天更直观） */
  function workDayLabel(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var now = new Date();
    var label = (d.getMonth() + 1) + '月' + d.getDate() + '日';
    if (d.toDateString() === now.toDateString()) return '今天 ' + label;
    var yesterday = new Date(now.getTime() - 86400000);
    if (d.toDateString() === yesterday.toDateString()) return '昨天 ' + label;
    return ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'][d.getDay()] + ' ' + label;
  }

  /**
   * 学生视角的作业状态
   * @param {object} item 作业数据
   * @returns {{t:string, cls:string}}
   */
  function workStatus(item) {
    if (!item.needSubmit) return { t: '无需提交', cls: 'muted' };
    if (item.grade) {
      return item.grade === '需修改'
        ? { t: '需修改', cls: 'warn' }
        : { t: '已批改', cls: 'done' };
    }
    if (item.submitted) return { t: '已完成', cls: 'done' };
    return { t: '需提交', cls: 'todo' };
  }

  /** 打开群作业列表（仅群聊） */
  function openWork() {
    if (!state.isGroup || !state.convId) {
      toast('仅群聊支持作业');
      return;
    }
    state.view = 'work';
    setHeader('作业', true, false);
    main.innerHTML = '<div class="work-body" id="workBody">'
      + '<div class="work-empty">加载中…</div></div>';
    loadWork();
  }

  /** 拉取作业列表 */
  function loadWork() {
    api('/conversations/' + enc(state.convId) + '/homework').then(function (data) {
      if (state.view !== 'work') return;                 // 已跳转到详情时不再重绘列表
      state.work.list = data.list || [];
      state.work.subjects = data.subjects || [];
      state.work.canManage = !!data.canManage;
      if (state.work.canManage) {
        setHeaderText('布置', function () { openAssign(null); });
      } else {
        menuBtn.style.visibility = 'hidden';
      }
      renderWork();
    }).catch(function (e) {
      var body = document.getElementById('workBody');
      if (body) body.innerHTML = '<div class="work-empty">' + esc(e.message) + '</div>';
    });
  }

  /** 渲染作业列表（Tab + 按日期分组） */
  function renderWork() {
    var body = document.getElementById('workBody');
    if (!body) return;
    var tabs = [['all', '全部作业'], ['mine', '我布置的'], ['stats', '统计与排行']];
    var html = '<div class="work-tabs">';
    tabs.forEach(function (tab) {
      html += '<div class="work-tab' + (state.work.tab === tab[0] ? ' on' : '')
        + '" data-tab="' + tab[0] + '">' + tab[1] + '</div>';
    });
    html += '</div><div class="work-list" id="workList"></div>';
    body.innerHTML = html;

    body.querySelectorAll('.work-tab').forEach(function (el) {
      el.addEventListener('click', function () {
        state.work.tab = el.getAttribute('data-tab');
        renderWork();
      });
    });

    var listEl = document.getElementById('workList');
    if (state.work.tab === 'stats') {
      listEl.innerHTML = workStatsHtml();
      return;
    }
    var list = state.work.list.slice();
    if (state.work.tab === 'mine') {
      list = list.filter(function (item) { return item.creatorId === MY_ID; });
    }
    if (!list.length) {
      listEl.innerHTML = '<div class="work-empty">还没有作业</div>';
      return;
    }
    var out = '';
    var lastDay = '';
    list.forEach(function (item) {
      var day = workDayLabel(item.createdAt);
      if (day !== lastDay) {
        out += '<div class="work-day">' + esc(day) + '</div>';
        lastDay = day;
      }
      out += workCardHtml(item);
    });
    listEl.innerHTML = out;
  }

  /**
   * 作业卡片 HTML
   * @param {object} item 作业数据
   * @returns {string}
   */
  function workCardHtml(item) {
    var status = item.canManage
      ? { t: '已提交 ' + (item.submittedCount || 0) + ' 人', cls: 'done' }
      : workStatus(item);
    return '<div class="work-card" data-work="' + esc(item.id) + '">'
      + '<div class="wc-head">' + subjectBadge(item.subject)
      + '<span>' + esc(shortDate(item.createdAt)) + '</span>'
      + '<span class="wc-status ' + status.cls + '">' + esc(status.t) + '</span></div>'
      + '<div class="wc-title">' + esc(item.title) + '</div>'
      + (item.content ? '<div class="wc-text">' + esc(item.content) + '</div>' : '')
      + '<div class="wc-foot">查看完整作业</div></div>';
  }

  /** 「统计与排行」内容：总体统计 + 布置排行 */
  function workStatsHtml() {
    var list = state.work.list || [];
    var needCount = 0;                                   // 需提交的作业数
    var submittedCount = 0;                              // 我已提交数
    var creators = {};                                   // 布置人 → 份数
    list.forEach(function (item) {
      if (item.needSubmit) needCount++;
      if (item.submitted) submittedCount++;
      var name = item.creatorName || '未知';
      creators[name] = (creators[name] || 0) + 1;
    });
    var rank = Object.keys(creators).sort(function (a, b) { return creators[b] - creators[a]; })
      .slice(0, 10);
    var html = '<div class="wd-card"><div class="wd-title">总体统计</div>'
      + '<div class="wd-meta">共 ' + list.length + ' 份作业 · 需提交 ' + needCount
      + ' 份 · 我已提交 ' + submittedCount + ' 份</div></div>'
      + '<div class="wd-card"><div class="wd-title">布置排行</div>';
    if (!rank.length) {
      html += '<div class="work-empty">暂无数据</div>';
    } else {
      rank.forEach(function (name, index) {
        html += '<div class="wd-sub"><span class="wc-subject" style="background:#12b7f5">'
          + (index + 1) + '</span><div class="wd-sub-main"><div class="wd-sub-name">'
          + esc(name) + '</div></div><span class="wd-badge">' + creators[name] + ' 份</span></div>';
      });
    }
    return html + '</div>';
  }

  /**
   * 打开布置 / 编辑作业页
   * @param {object|null} item 传入作业时为编辑，null 为新建
   */
  function openAssign(item) {
    state.view = 'workEdit';
    state.assignSubject = item ? item.subject : ((state.work.subjects || [])[0] || '语文');
    setHeader(item ? '编辑作业' : '布置作业', true, false);
    setHeaderText('发布', function () { publishWork(item); });
    main.innerHTML = '<div class="work-body"><div class="work-form">'
      + '<div class="wf-row">'
      + '<button class="wf-subject" id="wfSubject" style="background:' + subjectColor(state.assignSubject) + '">'
      + esc(subjectChar(state.assignSubject)) + '</button>'
      + '<input id="wfTitle" maxlength="50" placeholder="标题" value="' + esc(item ? item.title : '') + '">'
      + '</div>'
      + '<textarea class="wf-content" id="wfContent" maxlength="3000" placeholder="请输入作业内容">'
      + esc(item ? item.content : '') + '</textarea>'
      + '<div class="wf-switch"><span>需学生在线提交</span>'
      + '<input type="checkbox" id="wfNeed"' + ((!item || item.needSubmit) ? ' checked' : '') + '></div>'
      + '</div></div>';

    document.getElementById('wfSubject').addEventListener('click', function () {
      pickSubject(state.assignSubject, function (subject) {
        state.assignSubject = subject;
        var btn = document.getElementById('wfSubject');
        btn.textContent = subjectChar(subject);
        btn.style.background = subjectColor(subject);
      });
    });
  }

  /**
   * 提交布置 / 编辑
   * @param {object|null} item 编辑时的作业
   */
  function publishWork(item) {
    var titleElm = document.getElementById('wfTitle');
    var contentElm = document.getElementById('wfContent');
    if (!titleElm || !contentElm) return;
    var title = titleElm.value.trim();
    var content = contentElm.value.trim();
    var needSubmit = document.getElementById('wfNeed').checked;
    if (!title) return toast('请填写作业标题');
    if (!content) return toast('请填写作业内容');

    var body = { subject: state.assignSubject, title: title, content: content, needSubmit: needSubmit };
    var request = item
      ? api('/homework/' + enc(item.id), { method: 'PUT', body: body })
      : api('/conversations/' + enc(state.convId) + '/homework', { method: 'POST', body: body });
    request.then(function () {
      toast(item ? '已保存' : '已发布');
      openWork();
    }).catch(function (e) {
      toast('发布失败：' + e.message);
    });
  }

  /**
   * 底部分组选择科目
   * @param {string} current 当前科目
   * @param {Function} cb 选中回调
   */
  function pickSubject(current, cb) {
    var subjects = state.work.subjects.length ? state.work.subjects
      : Object.keys(HW_COLORS);
    var html = '<h3>请选择科目</h3>';
    subjects.forEach(function (subject) {
      html += '<div class="dlg-item" data-sub="' + esc(subject) + '"><span>' + esc(subject) + '</span>'
        + (subject === current ? '<span class="check">' + ICONS.check + '</span>' : '') + '</div>';
    });
    openDlg(html, function (root) {
      root.querySelectorAll('[data-sub]').forEach(function (el) {
        el.addEventListener('click', function () {
          closeDlg();
          cb(el.getAttribute('data-sub'));
        });
      });
    });
  }

  /**
   * 打开作业详情
   * @param {string} id 作业 ID
   */
  function openWorkDetail(id) {
    state.view = 'workDetail';
    setHeader('作业详情', true, false);
    menuBtn.style.visibility = 'hidden';
    main.innerHTML = '<div class="work-body"><div class="work-empty">加载中…</div></div>';
    api('/homework/' + enc(id)).then(function (item) {
      if (state.view !== 'workDetail') return;
      state.workDetail = item;
      renderWorkDetail(item);
    }).catch(function (e) {
      toast(e.message);
    });
  }

  /**
   * 渲染作业详情
   * @param {object} item 作业详情
   */
  function renderWorkDetail(item) {
    var html = '<div class="work-body"><div class="work-detail">'
      + '<div class="wd-card"><div class="wd-head">' + subjectBadge(item.subject)
      + '<span class="wd-title">' + esc(item.title) + '</span></div>'
      + '<div class="wd-meta">' + esc(item.creatorName || '') + ' · ' + esc(workDayLabel(item.createdAt))
      + (item.needSubmit ? ' · 需在线提交' : ' · 无需提交') + '</div>'
      + '<div class="wd-content">' + esc(item.content || '') + '</div>';

    if (item.canManage) {
      html += '<button class="wd-main-btn" id="wdEdit">编辑作业</button>'
        + '<button class="wd-del" id="wdDelete">删除作业</button>';
    } else if (item.submitted && item.myText) {
      html += '<div class="wd-sec">我的提交</div>'
        + '<div class="wd-content" style="margin-top:0">' + esc(item.myText) + '</div>';
      if (item.grade) {
        html += '<div class="wd-meta">批改：' + esc(item.grade)
          + (item.comment ? ' · ' + esc(item.comment) : '') + '</div>';
      }
    }
    html += '</div>';

    if (item.canManage) {
      var subs = item.submissions || [];
      html += '<div class="wd-sec">提交情况（' + subs.length + ' 人）</div><div class="wd-card">'
        + (subs.length ? subs.map(function (sub) {
          return '<div class="wd-sub">' + avatarHtml('/api/user-avatar/' + enc(sub.userId), sub.name)
            + '<div class="wd-sub-main"><div class="wd-sub-name">' + esc(sub.name)
            + (sub.grade ? '<span class="wd-badge">' + esc(sub.grade) + '</span>' : '') + '</div>'
            + '<div class="wd-sub-text">' + esc(sub.text || '') + '</div></div>'
            + '<button class="wd-btn" data-review="' + esc(sub.userId) + '">'
            + (sub.grade ? '改评' : '批改') + '</button></div>';
        }).join('') : '<div class="work-empty">还没有人提交</div>') + '</div>';
    } else if (item.needSubmit) {
      html += '<button class="wd-main-btn" id="wdSubmit">'
        + (item.submitted ? '重新提交' : '提交作业') + '</button>';
    }
    html += '</div></div>';
    main.innerHTML = html;

    // 事件绑定
    var editBtn = document.getElementById('wdEdit');
    if (editBtn) editBtn.addEventListener('click', function () { openAssign(item); });
    var delBtn = document.getElementById('wdDelete');
    if (delBtn) {
      delBtn.addEventListener('click', function () {
        confirmDlg('确定删除这份作业吗？', function () {
          api('/homework/' + enc(item.id), { method: 'DELETE' }).then(function () {
            toast('已删除');
            openWork();
          }).catch(function (e) { toast(e.message); });
        });
      });
    }
    var submitBtn = document.getElementById('wdSubmit');
    if (submitBtn) submitBtn.addEventListener('click', function () { openSubmitWork(item); });

    document.querySelectorAll('[data-review]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var userId = btn.getAttribute('data-review');
        var sub = (item.submissions || []).filter(function (x) { return x.userId === userId; })[0];
        if (sub) openReview(item, sub);
      });
    });
  }

  /** 学生提交作业弹窗 */
  function openSubmitWork(item) {
    var draft = item.myText || '';
    openDlg('<h3>提交作业</h3>'
      + '<textarea id="hwSubmitText" placeholder="请输入作业内容">' + esc(draft) + '</textarea>'
      + '<div class="dlg-actions"><button class="cancel" data-close>取消</button>'
      + '<button class="ok" id="hwSubmitOk">提交</button></div>', function (root) {
      root.querySelector('#hwSubmitOk').addEventListener('click', function () {
        var text = root.querySelector('#hwSubmitText').value.trim();
        if (!text) return toast('请填写作业内容');
        api('/homework/' + enc(item.id) + '/submit', { method: 'POST', body: { text: text } })
          .then(function () {
            closeDlg();
            toast('已提交');
            openWorkDetail(item.id);
          }).catch(function (e) { toast(e.message); });
      });
    });
  }

  /** 老师批改弹窗 */
  function openReview(item, sub) {
    var grades = ['优秀', '良好', '合格', '需修改'];
    var current = sub.grade || '合格';
    var html = '<h3>批改 · ' + esc(sub.name) + '</h3>'
      + '<div class="wd-content" style="margin-top:0">' + esc(sub.text || '') + '</div>'
      + '<div class="dlg-grades">';
    grades.forEach(function (g) {
      html += '<button class="dlg-grade' + (g === current ? ' on' : '') + '" data-grade="' + g + '">' + g + '</button>';
    });
    html += '</div>'
      + '<textarea id="hwComment" placeholder="评语（选填）">' + esc(sub.comment || '') + '</textarea>'
      + '<div class="dlg-actions"><button class="cancel" data-close>取消</button>'
      + '<button class="ok" id="hwReviewOk">保存</button></div>';

    openDlg(html, function (root) {
      var selected = current;                            // 当前选中的等级
      root.querySelectorAll('[data-grade]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          selected = btn.getAttribute('data-grade');
          root.querySelectorAll('[data-grade]').forEach(function (b) {
            b.classList.toggle('on', b === btn);
          });
        });
      });
      root.querySelector('#hwReviewOk').addEventListener('click', function () {
        api('/homework/' + enc(item.id) + '/review', {
          method: 'POST',
          body: { userId: sub.userId, grade: selected, comment: root.querySelector('#hwComment').value.trim() }
        }).then(function () {
          closeDlg();
          toast('已保存');
          openWorkDetail(item.id);
        }).catch(function (e) { toast(e.message); });
      });
    });
  }

  /** 从聊天作业卡片进入：先进列表，再进详情（返回时可逐级退出） */
  function openHomeworkFromChat(id) {
    openWork();
    openWorkDetail(id);
  }

  /**
   * 通用底部弹窗
   * @param {string} inner 内容 HTML
   * @param {Function} [onMount] 挂载后的绑定回调
   */
  function openDlg(inner, onMount) {
    closeDlg();
    var mask = document.createElement('div');
    mask.className = 'dlg-mask';
    mask.id = 'imDlg';
    mask.innerHTML = '<div class="dlg">' + inner + '</div>';
    mask.addEventListener('click', function (ev) {
      if (ev.target === mask) closeDlg();
    });
    mask.querySelectorAll('[data-close]').forEach(function (btn) {
      btn.addEventListener('click', closeDlg);
    });
    document.body.appendChild(mask);
    if (onMount) onMount(mask);
  }

  /** 关闭通用弹窗 */
  function closeDlg() {
    var el = document.getElementById('imDlg');
    if (el) el.remove();
  }

  /** 确认弹窗 */
  function confirmDlg(text, onOk) {
    openDlg('<h3>' + esc(text) + '</h3>'
      + '<div class="dlg-actions"><button class="cancel" data-close>取消</button>'
      + '<button class="ok" id="dlgOk">确定</button></div>', function (root) {
      root.querySelector('#dlgOk').addEventListener('click', function () {
        closeDlg();
        onOk();
      });
    });
  }

  /* ==================== 实时推送（WebSocket） ==================== */
  /** 当前长连接，null 表示未连接 */
  var wsConn = null;
  /** 重连次数：用于退避 */
  var wsRetry = 0;
  /** 重连定时器 */
  var wsTimer = null;

  /** 建立长连接：与页面同源，令牌放在 query 里（浏览器无法自定义握手头） */
  function connectWs() {
    if (!TOKEN) return;
    if (wsTimer) { clearTimeout(wsTimer); wsTimer = null; }
    var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    try {
      wsConn = new WebSocket(proto + location.host + '/im/ws?token=' + encodeURIComponent(TOKEN));
    } catch (e) {
      wsConn = null;
      scheduleWsReconnect();
      return;
    }
    wsConn.onopen = function () {
      wsRetry = 0;
    };
    wsConn.onmessage = function (ev) {
      var data;
      try { data = JSON.parse(ev.data); } catch (e) { return; }
      if (data && data.type === 'message') handleRealtimeMessage(data);
    };
    wsConn.onclose = function () {
      wsConn = null;
      scheduleWsReconnect();
    };
    wsConn.onerror = function () {
      try { wsConn.close(); } catch (e) { /* 忽略 */ }
    };
  }

  /** 断线重连：2 秒起步退避，最长 30 秒 */
  function scheduleWsReconnect() {
    if (wsTimer) return;
    var delay = Math.min(30000, 2000 * Math.pow(2, Math.min(wsRetry, 4)));
    wsRetry++;
    wsTimer = setTimeout(function () {
      wsTimer = null;
      connectWs();
    }, delay);
  }

  /**
   * 处理实时消息：当前会话直接刷新消息，其它情况刷新会话列表
   * @param {object} data 推送数据 { conversationId, conversation, message }
   */
  function handleRealtimeMessage(data) {
    // 自己发出的消息已由发送流程刷新，这里只处理别人的消息
    if (data.message && data.message.senderId === MY_ID) return;
    if (state.view === 'chat' && data.conversationId === state.convId) {
      loadMessages(true);
      markRead();
      return;
    }
    loadConvs();
  }

  /* ==================== 启动 ==================== */
  /**
   * 拉取当前登录用户信息（仅用于权限判断，如平台管理员可解散群聊；失败静默）
   */
  function loadMe() {
    api('/me').then(function (me) {
      state.me = me || {};
    }).catch(function () {
      state.me = {};
    });
  }

  loadMe();
  renderList();
  connectWs();
})();
</script>
</body>
</html>
