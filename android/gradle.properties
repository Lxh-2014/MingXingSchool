# Gradle 构建 JVM 参数：限制内存并固定 UTF-8，避免中文资源乱码
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 使用 AndroidX 库（Material / AppCompat 均依赖 AndroidX）
android.useAndroidX=true
# 非传递 R 类：每个模块只生成自己的资源索引，加快编译
android.nonTransitiveRClass=true

# 指定构建使用的 JDK（本机 Java 安装目录），如换机器需同步修改
org.gradle.java.home=D:/Java/jdk-17-oracle
